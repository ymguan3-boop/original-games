<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>戰鬥陀螺實際模型樣板</title><style>body{margin:0;background:#fff4db;color:#453021;font:16px/1.5 sans-serif}h1,p{padding:0 20px}h1{font-size:23px}img{display:block;width:min(100%,900px);margin:auto}canvas{display:block;width:100%;height:480px}button{padding:10px;margin:5px;border:2px solid #946a3e;background:#fff9e9;border-radius:9px}</style><h1>Lv.3 廣場戰鬥陀螺實際樣板</h1><p>上方為生圖參考；下方為兩顆陀螺實際自動對戰（真正 Three.js 幾何與碰撞）。圓盤置於廣場正中央，競價攤販保留在右側。</p><img src="../assets/spin-arena/flame-reference.png" alt="烈焰獅王三視圖參考"><h2 style="padding:0 20px;font-size:20px">image_gen 材質套用後的實際模型</h2><img style="max-width:512px;background:#e7ddc7;border-radius:20px" src="../assets/spin-arena/flame-iso.png" alt="隆起紅漆刃片、金屬嵌飾與獅王浮雕實際模型"><p>紅金烈焰獅王為本輪材質樣板，貼圖由內建 image_gen 生成並實際套到 3D 幾何；藍色陀螺為碰撞測試代理，尚非最終款式。</p><h2 style="padding:0 20px;font-size:20px">各級灰色競技場實際模型</h2><div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:12px"><figure style="margin:0;text-align:center"><img src="../assets/spin-arena/arena-grey-lv3-card.png" alt="Lv.3 灰岩青銅場"><figcaption>Lv.3 樸實青銅</figcaption></figure><figure style="margin:0;text-align:center"><img src="../assets/spin-arena/arena-grey-lv4-card.png" alt="Lv.4 寶石拱冠場"><figcaption>Lv.4 寶石拱冠</figcaption></figure><figure style="margin:0;text-align:center"><img src="../assets/spin-arena/arena-grey-lv5-card.png" alt="Lv.5 皇家獅冠場"><figcaption>Lv.5 皇家獅冠</figcaption></figure></div><div><label style="padding:10px">競技場等級 <select id="arenaLevel"><option value="3">Lv.3 灰岩青銅場 · 4 位觀眾</option><option value="4">Lv.4 寶石拱冠場 · 8 位觀眾</option><option value="5">Lv.5 皇家獅冠場 · 12 位觀眾</option></select></label><button id="angle">切換俯視／斜視</button></div><canvas id="model"></canvas><script src="../../幻靈奇旅/vendor/three.min.js"></script><script type="module">
import{person,cheerSpectator}from'../js/chibi/yard.js';import{plazaArenaTheme}from'../js/spin-arena-config.js?v=20261115-v60';import{createSpinModels}from'../js/spin-arena-models.js?v=20261115-v60';import{launchSpinRound,advanceSpinMatch,spinStats}from'../js/spin-arena-core.js?v=20261115-v60';const T=THREE,canvas=document.querySelector('canvas'),r=new T.WebGLRenderer({canvas,antialias:true,alpha:true});r.setPixelRatio(Math.min(2,devicePixelRatio));r.outputEncoding=T.sRGBEncoding;r.toneMapping=T.ACESFilmicToneMapping;let s=new T.Scene(),c=new T.PerspectiveCamera(40,1,.1,100),models=createSpinModels(T),arena=models.arena(),top=models.top('flame'),opponent=models.top('wind'),match={seed:51,round:1,difficulty:1,score:[0,0],rounds:[],effects:[],fx:0,playerStats:spinStats('flame'),opponentStats:spinStats('wind'),playerElement:'fire',opponentElement:'wind'};launchSpinRound(match,'balance');s.add(new T.HemisphereLight(0xfff7e3,0x514a65,.55));const l=new T.DirectionalLight(0xffffff,.8);l.position.set(4,8,5);s.add(l,arena,top,opponent);for(const o of[top,opponent])o.scale.setScalar(1.04);const spectators=[];function changeLevel(level){s.remove(arena);models.dispose(arena);arena=models.arena({level});s.add(arena);for(const p of spectators){s.remove(p.g);p.g.traverse(o=>o.geometry?.dispose());}spectators.length=0;const theme=plazaArenaTheme(level);for(let i=0;i<theme.spectators;i++){const a=Math.PI*(.15+.72*i/(theme.spectators-1)),p=person({seed:6300+i*29,scale:.85,spectator:true});p.g.position.set(Math.cos(a)*3.3,0,Math.sin(a)*3.3);p.g.rotation.y=Math.atan2(-p.g.position.x,-p.g.position.z);s.add(p.g);spectators.push(p);}if(window.pilot){pilot.arena=arena;pilot.spectators=spectators;}}document.querySelector('#arenaLevel').onchange=e=>changeLevel(+e.target.value);changeLevel(3);let prev=0;let overhead=false;document.querySelector('#angle').onclick=()=>overhead=!overhead;function frame(t){const w=canvas.clientWidth,h=480;r.setSize(w,h,false);c.aspect=w/h;c.position.set(overhead?0:6,overhead?11:7,overhead?.01:8);c.lookAt(0,.2,0);c.updateProjectionMatrix();const dt=prev?Math.min(.05,(t-prev)/1000):.016;prev=t;if(match.phase!=='battle'){if(match.phase==='result'){match.score=[0,0];match.round=1;match.rounds=[];}launchSpinRound(match,'balance');}advanceSpinMatch(match,dt);for(const[o,i]of[[top,0],[opponent,1]]){const b=match.bodies[i];o.position.set(b.x,.36+(Math.hypot(b.x,b.z)/2.3)**3*.3,b.z);o.rotation.y=b.angle;}for(let i=0;i<spectators.length;i++){const p=spectators[i];cheerSpectator(p,t/1000,i);}r.render(s,c);requestAnimationFrame(frame);}requestAnimationFrame(frame);window.pilot={s,c,models,r,arena,top,spectators};
</script></html>
