<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>初光商會・各級專屬物件</title><style>body{margin:0;padding:18px;background:#f7f0de;color:#4a3626;font:14px/1.6 sans-serif}main{max-width:1100px;margin:auto}h1{font-size:22px}nav{display:flex;gap:6px;flex-wrap:wrap;position:sticky;top:0;background:#f7f0de;z-index:2;padding:8px 0}button{border:1px solid #987856;border-radius:10px;background:#fff9ed;color:#493723;padding:9px 13px}button[aria-pressed=true]{background:#6e8d49;color:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.item{background:#fffaf0;border:1px solid #c0a27a;border-radius:14px;text-align:center;padding:8px}.item img{width:100%;height:155px;object-fit:contain}.concept{max-width:100%;max-height:440px;object-fit:contain;display:block;margin:auto}h3{margin:18px 0 8px}small{display:block}a{color:#516c38}.states{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.states img{width:100%}details{margin:10px 0}</style><main><h1>各級專屬貨架、家具與裝飾</h1><p>下方全部為遊戲實際模型渲染。礦木料槽占 2×1 格，其餘物件採 1×1 格對齊；地毯為可通行的 2.7×1.9 格；掛件依可用牆面掛放。礦木貨架依你的草圖改為低式開放雙料槽，礦石與木材各占一半。</p><nav id="levels"></nav><h2 id="title"></h2><details><summary>本級生圖設計參考（礦木料槽以最新草圖優先）</summary><img class="concept" id="concept"></details><h3>貨架：充足／銷售過半／完售</h3><div class="grid" id="racks"></div><h3>家具與裝飾</h3><div class="grid" id="decor"></div><p><a href="../?shopDev=1">返回本機遊戲</a></p></main><script type="module">
import{TIER_DESIGNS,tierThumb}from'../js/tier-designs.js?v=20261114-v48';import{shelvesForLevel}from'../js/furniture.js?v=20261114-v48';import{decorForLevel}from'../js/decorations.js?v=20261114-v48';const fix=s=>'../'+s.slice(2),esc=s=>s.replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
function show(level){document.querySelector('#title').textContent=`Lv.${level} ${TIER_DESIGNS[level].name}`;document.querySelector('#concept').src=`../assets/art-v42/lv${level}-concept.png`;document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-pressed',Number(b.dataset.level)===level));document.querySelector('#racks').innerHTML=shelvesForLevel(level).map(d=>`<article class="item"><b>${esc(d.name)}</b><div class="states">${['full','half','sold-out'].map(s=>`<img loading="lazy" src="${fix(tierThumb('rack',d.id,level,s))}" alt="${s}">`).join('')}</div><small>容量 ${d.capacity}・${d.cost} G</small></article>`).join('');document.querySelector('#decor').innerHTML=decorForLevel(level).map(d=>`<article class="item"><img loading="lazy" src="${fix(tierThumb('decor',d.id,level))}" alt=""><b>${esc(d.name)}</b><small>${d.description}・${d.cost} G</small></article>`).join('');window.galleryLevel=level;}
for(let i=1;i<=10;i++){const b=document.createElement('button');b.textContent='Lv.'+i;b.dataset.level=i;b.onclick=()=>show(i);document.querySelector('#levels').append(b);}show(1);
</script></html>
