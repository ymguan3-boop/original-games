<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><style>body{margin:0}canvas{display:block}</style><canvas></canvas><script src="../../幻靈奇旅/vendor/three.min.js"></script><script type="module">

const T=THREE,r=new T.WebGLRenderer({canvas:document.querySelector('canvas'),alpha:true,antialias:true,preserveDrawingBuffer:true});r.setSize(200,256);r.outputEncoding=T.sRGBEncoding;const s=new T.Scene(),c=new T.PerspectiveCamera(28,200/256,.1,30);c.position.set(.25,1.05,3.8);c.lookAt(0,.7,0);s.add(new T.HemisphereLight(0xfff8ea,0x576779,1));const sun=new T.DirectionalLight(0xffffff,.9);sun.position.set(3,6,4);s.add(sun);const audience=Array.from({length:4},(_,i)=>person({seed:6300+i*29,spectator:true,scale:1}));for(const p of audience){s.add(p.g);p.g.visible=false;}
