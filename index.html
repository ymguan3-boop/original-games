<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>官家大亂鬥 - 橫向卷軸動作過關</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a12;font-family:'Segoe UI','Microsoft YaHei',sans-serif}
body{display:flex;justify-content:center;align-items:center;background:radial-gradient(ellipse at center,#1a1a2e 0%,#0a0a12 70%)}
#wrapper{text-align:center;animation:fadeIn 0.8s ease-out}
h1{font-size:42px;font-weight:900;margin-bottom:4px;background:linear-gradient(135deg,#f0c040,#ff6b35,#ff4444,#a855f7,#3b82f6);background-size:300% 300%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:gradientShift 3s ease infinite;letter-spacing:4px}
.sub{color:#888;font-size:16px;letter-spacing:2px;margin-bottom:12px}
#border{display:inline-block;padding:4px;border-radius:8px;background:linear-gradient(135deg,#f0c040,#ff6b35,#a855f7,#3b82f6);background-size:400% 400%;animation:gradientShift 4s ease infinite}
canvas{display:block;border-radius:6px;background:#000;width:540px;height:600px}
.controls{margin-top:12px;color:#888;font-size:12px}
.controls span{display:inline-block;background:rgba(255,255,255,0.05);padding:6px 16px;border-radius:20px;border:1px solid rgba(255,255,255,0.1);animation:fadeIn 0.8s ease-out 0.6s both;line-height:1.8}
@keyframes gradientShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes fadeIn{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes slideUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}
@keyframes cardHover{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:1000;justify-content:center;align-items:center;flex-direction:column}
.modal-overlay.active{display:flex}
.modal-box{background:linear-gradient(135deg,#1a1a2e,#2a2a4e);border:2px solid #f0c040;border-radius:16px;padding:30px;max-width:380px;width:90%;text-align:center;animation:slideUp 0.4s ease-out}
.modal-box h2{color:#f0c040;font-size:22px;margin-bottom:14px}
.modal-box input{width:80%;padding:12px 20px;font-size:18px;border:2px solid #555;border-radius:8px;background:#0a0a12;color:#fff;text-align:center;outline:none;margin-bottom:16px}
.modal-box input:focus{border-color:#f0c040}
.modal-box button{padding:12px 40px;font-size:18px;font-weight:bold;border:none;border-radius:8px;background:linear-gradient(135deg,#f0c040,#ff6b35);color:#000;cursor:pointer;transition:all 0.2s}
.modal-box button:hover{transform:scale(1.05);box-shadow:0 0 20px rgba(240,192,64,0.5)}
.modal-box button:disabled{opacity:0.4;cursor:not-allowed;transform:none}
.card-container{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.ability-card{width:100px;padding:14px 8px;border:2px solid #555;border-radius:10px;background:#0a0a2e;cursor:pointer;transition:all 0.3s;animation:cardHover 2s ease-in-out infinite}
.ability-card:nth-child(2){animation-delay:0.3s}
.ability-card:nth-child(3){animation-delay:0.6s}
.ability-card:hover{border-color:#f0c040;transform:translateY(-8px);box-shadow:0 8px 25px rgba(240,192,64,0.3)}
.ability-card .icon{font-size:28px;margin-bottom:6px}
.ability-card .name{color:#f0c040;font-size:12px;font-weight:bold;margin-bottom:4px}
.ability-card .desc{color:#aaa;font-size:10px;line-height:1.3}
.lb-container{max-height:400px;overflow-y:auto;margin-top:16px}
.lb-row{display:flex;justify-content:space-between;padding:8px 16px;border-bottom:1px solid rgba(255,255,255,0.1);color:#fff;font-size:14px}
.lb-row:nth-child(1){color:#f0c040}
.lb-row:nth-child(2){color:#c0c0c0}
.lb-row:nth-child(3){color:#cd7f32}
.lb-row .rank{width:40px;text-align:left}
.lb-row .name{flex:1;text-align:left}
.lb-row .score{width:80px;text-align:right}
.lb-row .date{width:100px;text-align:right;font-size:11px;color:#888}
#leaderboardBtn{position:fixed;top:10px;right:10px;z-index:100;padding:8px 16px;border:1px solid rgba(240,192,64,0.4);border-radius:20px;background:rgba(0,0,0,0.6);color:#f0c040;font-size:12px;cursor:pointer;display:none}
#leaderboardBtn:hover{background:rgba(240,192,64,0.2)}
#mobileControls{display:none;position:fixed;bottom:0;left:0;width:100%;height:200px;z-index:50;pointer-events:none}
.joystick{position:absolute;left:20px;bottom:80px;width:120px;height:120px;pointer-events:auto;border-radius:50%;background:rgba(255,255,255,0.08);border:2px solid rgba(255,255,255,0.2);touch-action:none;display:flex;justify-content:center;align-items:center}
.joystick-knob{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,0.25);border:2px solid rgba(255,255,255,0.4);position:absolute;transition:none;pointer-events:none}
.action-btns{position:absolute;right:20px;bottom:80px;width:132px;height:176px;pointer-events:auto}
.act-btn{position:absolute;width:44px;height:44px;border-radius:50%;display:flex;justify-content:center;align-items:center;color:#fff;font-size:13px;font-weight:bold;user-select:none;-webkit-user-select:none;touch-action:none;border:2px solid rgba(255,255,255,0.3)}
.act-btn:active{opacity:0.7}
.btn-z{left:0;top:44px;background:rgba(255,100,100,0.4)}
.btn-x{right:0;top:44px;background:rgba(100,100,255,0.4)}
.btn-a{left:44px;top:0;background:rgba(255,200,50,0.4)}
.btn-s{left:44px;bottom:44px;background:rgba(100,200,100,0.4)}
.btn-gugu{left:44px;bottom:0;background:rgba(200,100,255,0.4);font-size:10px}
.btn-r{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);background:rgba(200,200,200,0.35);font-size:11px;width:40px;height:26px;border-radius:13px;color:#fff;display:flex;justify-content:center;align-items:center;user-select:none;-webkit-user-select:none;touch-action:none;border:1px solid rgba(255,255,255,0.3);pointer-events:auto}
.btn-r:active{opacity:0.7}
@media(max-width:1000px){canvas{width:100%;height:auto;aspect-ratio:9/10}}
@media(pointer:coarse){#mobileControls{display:block}#leaderboardBtn{display:block}.controls{display:none}}
#loadingOverlay{position:fixed;top:0;left:0;width:100%;height:100%;background:#111;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:100;transition:opacity 0.5s}
#loadingOverlay.hide{opacity:0;pointer-events:none}
#loadingText{color:#fff;font:bold 28px "Segoe UI",sans-serif;letter-spacing:4px}
#loadingBar{width:200px;height:6px;background:#333;border-radius:3px;margin-top:16px;overflow:hidden}
#loadingFill{width:0%;height:100%;background:linear-gradient(90deg,#f44,#fa0,#4f4);border-radius:3px;transition:width 0.3s}
@keyframes loadPulse{0%,100%{opacity:0.5}50%{opacity:1}}
#loadingText{animation:loadPulse 1.2s ease-in-out infinite}
</style>
</head>
<body>
<div id="wrapper">
<h1>&#x2694; 官家大亂鬥 &#x2694;</h1>
<p class="sub">製作人:官毅明</p>
<div id="loadingOverlay"><div id="loadingText">LOADING...</div><div id="loadingBar"><div id="loadingFill"></div></div></div>
<div id="border"><canvas id="game" width="540" height="600"></canvas></div>
<p class="controls"><span>
↑↓←→=自由行走 | Z=出拳 | X=踢擊 | A=大絕招(冷卻10秒) | S=使用道具 | Z+X=招喚姑姑 | R=重新開始
</span></p>
</div>

<!-- Name Input Modal -->
<div id="nameModal" class="modal-overlay active">
<div class="modal-box">
<h2>&#x2694; 官家大亂鬥 &#x2694;</h2>
<p style="color:#aaa;margin-bottom:20px">請輸入你的名字開始遊戲</p>
<input type="text" id="playerNameInput" placeholder="輸入玩家姓名" maxlength="12" autocomplete="off">
<br><br>
<button id="startBtn" onclick="goToCharSelect()">開始遊戲</button>
<div id="nameRankList" style="margin-top:16px;max-height:240px;overflow-y:auto;text-align:left"></div>
<div style="margin-top:16px;padding:12px;background:rgba(255,255,255,0.08);border-radius:8px;text-align:left;font-size:12px;color:#aaa;line-height:1.8">
<div>↑↓←→ = 自由行走</div>
<div>Z = 出拳 | X = 踢擊</div>
<div>A = 大絕招（冷卻10秒）</div>
<div>S = 使用道具 | R = 重新開始</div>
<div>Z+X = 招喚姑姑（姑姑死亡後30秒CD）</div>
</div>
</div>
</div>

<!-- Character Select Modal -->
<div id="charSelectModal" class="modal-overlay">
<div class="modal-box">
<h2>選擇角色</h2>
<p style="color:#aaa;margin-bottom:20px">點擊選擇你的角色</p>
<div style="display:flex;gap:30px;justify-content:center">
<div class="char-option" onclick="selectCharacter('hero1')">
<img src="主角動作包/主角形像照.png" style="width:160px;height:200px;object-fit:cover;border-radius:12px;border:3px solid #555;cursor:pointer;transition:all 0.3s" onmouseover="this.style.borderColor='#f0c040';this.style.transform='scale(1.05)'" onmouseout="this.style.borderColor='#555';this.style.transform='scale(1)'">
<p style="color:#f0c040;margin-top:8px;font-weight:bold">主角</p>
</div>
<div class="char-option" onclick="selectCharacter('hero2')">
<img src="主角2動作包/主角2形像照.png" style="width:160px;height:200px;object-fit:cover;border-radius:12px;border:3px solid #555;cursor:pointer;transition:all 0.3s" onmouseover="this.style.borderColor='#f0c040';this.style.transform='scale(1.05)'" onmouseout="this.style.borderColor='#555';this.style.transform='scale(1)'">
<p style="color:#f0c040;margin-top:8px;font-weight:bold">主角2</p>
</div>
</div>
</div>
</div>

<!-- Level Up Card Modal -->
<div id="levelUpModal" class="modal-overlay">
<div class="modal-box">
<h2 id="levelUpTitle">升級！選擇能力</h2>
<div class="card-container" id="cardContainer"></div>
</div>
</div>

<!-- Leaderboard Modal -->
<div id="lbModal" class="modal-overlay">
<div class="modal-box">
<h2>&#x1F3C6; 排行榜</h2>
<div class="lb-container" id="lbContent"></div>
<br>
<button onclick="closeLB()">關閉</button>
</div>
</div>

<!-- Leaderboard Button -->
<button id="leaderboardBtn" onclick="showLB()">&#x1F3C6; 排行榜</button>

<!-- Mobile Controls -->
<div id="mobileControls">
<div class="joystick" id="joystick">
<div class="joystick-knob" id="joystickKnob"></div>
</div>
<div class="action-btns">
<div class="act-btn btn-z" data-key="z">Z</div>
<div class="act-btn btn-x" data-key="x">X</div>
<div class="act-btn btn-a" data-key="a">A</div>
<div class="act-btn btn-s" data-key="s">S</div>
<div class="act-btn btn-gugu" data-key="gugu">Z+X</div>
</div>
<div class="act-btn btn-r" data-key="r">R</div>
</div>

<script>
// ============================================================
// CONSTANTS
// ============================================================
const CW=540,CH=600,ROAD_TOP=250,ROAD_BOTTOM=580,LEVEL_LEN=4000;
const KEY={L:'ArrowLeft',R:'ArrowRight',U:'ArrowUp',D:'ArrowDown',P:'z',K:'x',A:'a',S:'s'};
const HERO={HP:500,MP:200,SPD:3.5,JUMP:-9,W:40,H:64,ATK_RNG:100,ATK_DMG:25,MP_REGEN:0.2};
const SCALE=1.56;
const XP_KILL={xiaoguai1:10,xiaoguai2:20,xiaoguai3:30,xiaoguai4:35,xiaowang:50,xiaowang2:60};
const XP_PER_LEVEL=100;
const ULT_COOLDOWN=600;
const GAME_TIME=300;
const MAX_ENEMIES=8;
const MAX_BOSSES=5;
const SPAWN_INTERVAL=180;
const ENEMY_CFG={
  xiaoguai1:{name:'小怪1',HP:150,SPD:0.9,DMG:12,W:36,H:56,col:'#a88',
    anim:{idle:{frames:3,dur:14,loop:true},walk:{frames:3,dur:7,loop:true},
      attack:{frames:3,dur:10,loop:false},hurt:{frames:1,dur:6,loop:false},death:{frames:3,dur:12,loop:false}}},
  xiaoguai2:{name:'小怪2',HP:200,SPD:1.1,DMG:15,W:40,H:60,col:'#8af',
    anim:{idle:{frames:3,dur:14,loop:true},walk:{frames:3,dur:6,loop:true},
      attack:{frames:3,dur:12,loop:false},hurt:{frames:1,dur:6,loop:false},death:{frames:3,dur:12,loop:false}}},
  xiaoguai3:{name:'小怪3',HP:250,SPD:1.0,DMG:18,W:42,H:65,col:'#fa0',
    anim:{idle:{frames:3,dur:14,loop:true},walk:{frames:3,dur:7,loop:true},
      attack:{frames:3,dur:10,loop:false},hurt:{frames:1,dur:6,loop:false},death:{frames:3,dur:12,loop:false}}},
  xiaoguai4:{name:'小怪4',HP:300,SPD:1.2,DMG:20,W:44,H:68,col:'#f8a',
    anim:{idle:{frames:2,dur:14,loop:true},walk:{frames:2,dur:8,loop:true},
      attack:{frames:3,dur:10,loop:false},hurt:{frames:1,dur:6,loop:false},death:{frames:2,dur:15,loop:false}}},
  xiaowang:{name:'小王',HP:800,SPD:0.8,DMG:20,W:50,H:70,col:'#f44',
    anim:{idle:{frames:3,dur:14,loop:true},walk:{frames:3,dur:7,loop:true},
      attack:{frames:4,dur:10,loop:false},kick:{frames:3,dur:10,loop:false},
      kickfly:{frames:7,dur:15,loop:false},
      hurt:{frames:1,dur:6,loop:false},death:{frames:1,dur:10,loop:false}}},
  xiaowang2:{name:'小王2',HP:1200,SPD:0.9,DMG:25,W:50,H:70,col:'#f80',
    anim:{idle:{frames:3,dur:15,loop:true},walk:{frames:3,dur:15,loop:true},
      attack:{frames:3,dur:15,loop:false},kickfly:{frames:9,dur:15,loop:false},
      hurt:{frames:1,dur:15,loop:false},death:{frames:3,dur:15,loop:false}}}
};
const ITEM_CFG={
  health:{name:'回血瓶',col:'#4c4',uses:1,dmg:0,throw:false,heal:true},
  knife:{name:'飛刀',col:'#ddd',uses:3,dmg:25,throw:true,pierce:true},
  grenade:{name:'手榴彈',col:'#888',uses:2,dmg:40,throw:true,pierce:true,explode:true}
};
const ITEM_SPRITE_PATH='道具/';
const itemImgs={};
function loadItemImages(cb){
  const map={health:'回血瓶.png',knife:'飛刀.png',grenade:'手榴彈.png'};
  let loaded=0,total=Object.keys(map).length;
  Object.entries(map).forEach(([k,f])=>{
    const img=new Image();
    img.onload=()=>{loaded++;if(loaded>=total)cb()};
    img.onerror=()=>{loaded++;if(loaded>=total)cb()};
    img.src=ITEM_SPRITE_PATH+f;itemImgs[k]=img;
  });
}
const ANIM={
  idle:{frames:1,dur:14,loop:true},walk:{frames:4,dur:6,loop:true},
  punch:{frames:3,dur:10,loop:false},kick:{frames:3,dur:10,loop:false},
  hurt:{frames:1,dur:10,loop:false},death:{frames:3,dur:20,loop:false},
  ultimate:{frames:16,dur:6,loop:false}
};

const ABILITY_DEFS=[
  {id:'punchSpeed',name:'出拳加速',icon:'&#x1F44A;',desc:'每選擇一次出拳速度+10%，可累計',apply:h=>{h.punchSpdMul=(h.punchSpdMul||1)+0.1}},
  {id:'kickCombo',name:'踢擊連擊',icon:'&#x1F9B6;',desc:'每選擇一次踢擊命中判定+1次，可累計',apply:h=>{h.kickBonusHits=(h.kickBonusHits||0)+1}},
  {id:'ultCombo',name:'大絕連擊數增加',icon:'&#x26A1;',desc:'每選擇一次大絕招COMBO+1，可累計',apply:h=>{h.ultBonusHits=(h.ultBonusHits||0)+1}},
  {id:'atkDamage',name:'攻擊傷害+10%',icon:'&#x1F525;',desc:'所有攻擊擊中敵人傷害+10%，可累計',apply:h=>{h.atkDmgMul=(h.atkDmgMul||1)+0.1}},
  {id:'defense',name:'防禦+10%',icon:'&#x1F6E1;&#xFE0F;',desc:'敵人造成主角的傷害-10%，可累計',apply:h=>{h.defMul=(h.defMul||1)-0.1}},
  {id:'atkRange',name:'攻擊範圍擴大',icon:'&#x1F3F9;',desc:'攻擊範圍+10%，可累計',apply:h=>{h.atkRngMul=(h.atkRngMul||1)+0.1}}
];

// ============================================================
// AUDIO
// ============================================================
let actx=null;
function ac(){if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();return actx}
function sfx(t){
  try{
    const c=ac(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);
    if(t==='hit'){o.type='square';o.frequency.setValueAtTime(150,c.currentTime);o.frequency.exponentialRampToValueAtTime(50,c.currentTime+0.1);g.gain.setValueAtTime(0.3,c.currentTime);g.gain.exponentialRampToValueAtTime(0.01,c.currentTime+0.15);o.start(c.currentTime);o.stop(c.currentTime+0.15)}
    else if(t==='punch'){o.type='sawtooth';o.frequency.setValueAtTime(200,c.currentTime);o.frequency.exponentialRampToValueAtTime(80,c.currentTime+0.08);g.gain.setValueAtTime(0.4,c.currentTime);g.gain.exponentialRampToValueAtTime(0.01,c.currentTime+0.12);o.start(c.currentTime);o.stop(c.currentTime+0.12)}
    else if(t==='combo'){[523,659,784].forEach((f,i)=>{const o2=c.createOscillator(),g2=c.createGain();o2.connect(g2);g2.connect(c.destination);o2.type='sine';o2.frequency.setValueAtTime(f,c.currentTime+i*0.08);g2.gain.setValueAtTime(0.2,c.currentTime+i*0.08);g2.gain.exponentialRampToValueAtTime(0.01,c.currentTime+i*0.08+0.1);o2.start(c.currentTime+i*0.08);o2.stop(c.currentTime+i*0.08+0.1)})}
    else if(t==='kill'){[400,300,200,100].forEach((f,i)=>{const o2=c.createOscillator(),g2=c.createGain();o2.connect(g2);g2.connect(c.destination);o2.type='triangle';o2.frequency.setValueAtTime(f,c.currentTime+i*0.1);g2.gain.setValueAtTime(0.3,c.currentTime+i*0.1);g2.gain.exponentialRampToValueAtTime(0.01,c.currentTime+i*0.1+0.15);o2.start(c.currentTime+i*0.1);o2.stop(c.currentTime+i*0.1+0.15)})}
    else if(t==='jump'){o.type='sine';o.frequency.setValueAtTime(200,c.currentTime);o.frequency.exponentialRampToValueAtTime(500,c.currentTime+0.15);g.gain.setValueAtTime(0.15,c.currentTime);g.gain.exponentialRampToValueAtTime(0.01,c.currentTime+0.2);o.start(c.currentTime);o.stop(c.currentTime+0.2)}
    else if(t==='phit'){o.type='sawtooth';o.frequency.setValueAtTime(300,c.currentTime);o.frequency.exponentialRampToValueAtTime(100,c.currentTime+0.2);g.gain.setValueAtTime(0.4,c.currentTime);g.gain.exponentialRampToValueAtTime(0.01,c.currentTime+0.25);o.start(c.currentTime);o.stop(c.currentTime+0.25)}
    else if(t==='boss'){[80,70,60].forEach((f,i)=>{const o2=c.createOscillator(),g2=c.createGain();o2.connect(g2);g2.connect(c.destination);o2.type='sawtooth';o2.frequency.setValueAtTime(f,c.currentTime+i*0.2);g2.gain.setValueAtTime(0.3,c.currentTime+i*0.2);g2.gain.exponentialRampToValueAtTime(0.01,c.currentTime+i*0.2+0.3);o2.start(c.currentTime+i*0.2);o2.stop(c.currentTime+i*0.2+0.3)})}
    else if(t==='pick'){[880,1100].forEach((f,i)=>{const o2=c.createOscillator(),g2=c.createGain();o2.connect(g2);g2.connect(c.destination);o2.type='sine';o2.frequency.setValueAtTime(f,c.currentTime+i*0.06);g2.gain.setValueAtTime(0.15,c.currentTime+i*0.06);g2.gain.exponentialRampToValueAtTime(0.01,c.currentTime+i*0.06+0.1);o2.start(c.currentTime+i*0.06);o2.stop(c.currentTime+i*0.06+0.1)})}

  Object.keys(GUGU_STATE_FILES).forEach(state=>{
    guguSprites[state]=[];
    GUGU_STATE_FILES[state].forEach((f,i)=>{
      total++;const img=new Image();
      img.onload=()=>{loaded++;if(loaded>=total)cb()};
      img.onerror=()=>{loaded++;if(loaded>=total)cb()};
      img.src=GUGU_PATH+f;guguSprites[state][i]=img;
    });
  });
}
function drawGugu(ctx,x,y,fIdx,facing,flash,state){
  const img=guguSprites[state]&&guguSprites[state][fIdx];
  if(img&&img.complete&&img.naturalWidth>0){
    ctx.save();ctx.translate(x,y);
    if(facing>0)ctx.scale(-1,1);if(flash)ctx.globalAlpha=0.5;
    const sw=img.naturalWidth,sh=img.naturalHeight;
    const scale=Math.min(50/sw,64/sh)*SCALE*1.32*(state==='ultimate'?1.69:1.1);
    ctx.drawImage(img,-sw*scale/2,-sh*scale,sw*scale,sh*scale);
    ctx.restore();
  }else{
    ctx.save();ctx.translate(x,y);if(facing>0)ctx.scale(-1,1);ctx.scale(SCALE*1.32*1.1,SCALE*1.32*1.1);
    ctx.fillStyle='#f0f';ctx.fillRect(-10,-24,20,24);
    ctx.fillStyle='#ff0';ctx.beginPath();ctx.arc(0,-30,8,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
}

function drawParticles(ctx,ps,camX){ps.forEach(p=>{const sx=p.x-camX;if(sx<-50||sx>CW+50)return;ctx.save();ctx.globalAlpha=p.life;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(sx,p.y,p.size*p.life,0,Math.PI*2);ctx.fill();ctx.restore()})}
function drawCmb(ctx,x,y,c){ctx.save();ctx.font='bold 33px "Segoe UI",sans-serif';ctx.textAlign='center';ctx.strokeStyle='#000';ctx.lineWidth=5;ctx.strokeText(c+' COMBO!',x,y);ctx.fillStyle='#ff0';ctx.fillText(c+' COMBO!',x,y);ctx.restore()}
function drawHB(ctx,x,y,w,h,cur,mx,col,lb){const r=Math.max(0,cur/mx);ctx.fillStyle='#333';ctx.fillRect(x,y,w,h);ctx.fillStyle=col;ctx.fillRect(x+2,y+2,(w-4)*r,h-4);ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.strokeRect(x,y,w,h);if(lb){ctx.fillStyle='#fff';ctx.font='bold 11px sans-serif';ctx.textAlign='left';ctx.fillText(lb,x+4,y+12)}}
function drawItem(ctx,x,y,type,fi){
  const t=ITEM_CFG[type],bob=Math.sin(fi*0.05)*3;if(!t)return;
  const img=itemImgs[type];
  ctx.save();ctx.translate(x,y+bob);
  if(img&&img.complete&&img.naturalWidth>0){
    const sw=img.naturalWidth,sh=img.naturalHeight;
    const s=Math.min(32/sw,32/sh)*SCALE*0.8;
    ctx.drawImage(img,-sw*s/2,-sh*s,sw*s,sh*s);
  }else{
    ctx.scale(SCALE*0.8,SCALE*0.8);
    ctx.fillStyle=t.col;ctx.beginPath();ctx.arc(0,-8,8,0,Math.PI*2);ctx.fill();
  }
  ctx.restore()}
function drawProj(ctx,x,y,type,col,rot,sMul,fa){
  if(type==='qigong'){
    const img=QIGONG_IMGS[col];ctx.save();
    if(img&&img.complete&&img.naturalWidth>0){
      const sw=img.naturalWidth,sh=img.naturalHeight;
      const s=Math.max(48/sw,48/sh)*SCALE*0.8*(sMul||1);
      if(fa>0){ctx.translate(x,y);ctx.scale(-1,1);ctx.drawImage(img,-sw*s/2,-sh*s/2,sw*s,sh*s)}
      else ctx.drawImage(img,x-sw*s/2,y-sh*s/2,sw*s,sh*s);
    }
    ctx.restore();return
  }
  const img=itemImgs[type];
  ctx.save();ctx.translate(x,y);ctx.rotate(rot||0);
  if(img&&img.complete&&img.naturalWidth>0){
    const sw=img.naturalWidth,sh=img.naturalHeight;
    const s=Math.min(28/sw,28/sh)*SCALE*0.8;
    ctx.drawImage(img,-sw*s/2,-sh*s/2,sw*s,sh*s);
  }else{
    ctx.scale(SCALE*0.8,SCALE*0.8);ctx.fillStyle=col;ctx.globalAlpha=0.9;
    ctx.beginPath();ctx.arc(0,0,6,0,Math.PI*2);ctx.fill();
  }
  ctx.restore()}

function startAnim(e,st,cfg,dur){
  const c=cfg||(e.animCfg||ANIM);
  if(e.animState===st&&e.animLoop)return;
  e.animState=st;e.animFrame=0;e.animTimer=dur||c[st].dur;
  e.animLoop=c[st].loop;e.animDone=false;e.animCustomDur=dur||0;
}
function tickAnim(e){
  const c=e.animCfg||ANIM;
  if(e.animDone)return;e.animTimer--;
  if(e.animTimer<=0){e.animFrame++;
    if(e.animFrame>=c[e.animState].frames){
      if(e.animLoop)e.animFrame=0;
      else{e.animFrame=c[e.animState].frames-1;e.animDone=true}
    }e.animTimer=e.animCustomDur||c[e.animState].dur;
  }
}

const FB_API_KEY='AIzaSyDqI7D7in2Ev00Jt3EvEUYd9cinwkEOg9c';
const FB_PROJECT='guanfight';
const FB_COL='leaderboard';
const fbURL='https://firestore.googleapis.com/v1/projects/'+FB_PROJECT+'/databases/(default)/documents';
async function fetchLB(){
  try{
    const r=await fetch(fbURL+':runQuery?key='+FB_API_KEY,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({structuredQuery:{from:[{collectionId:FB_COL}],orderBy:[{field:{fieldPath:'score'},direction:'DESCENDING'}],limit:10}})});
    if(!r.ok)return[];
    const rows=await r.json();
    return rows.filter(x=>x.document).map(x=>{
      const f=x.document.fields;
      return{name:(f.name&&f.name.stringValue)||'?',score:parseInt((f.score&&f.score.integerValue)||0,10)};
    });
  }catch(e){return[]}
}
async function saveScore(name,score){
  try{
    await fetch(fbURL+'/'+FB_COL+'?key='+FB_API_KEY,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({fields:{name:{stringValue:String(name)},score:{integerValue:score}}})});
    const r=await fetch(fbURL+':runQuery?key='+FB_API_KEY,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({structuredQuery:{from:[{collectionId:FB_COL}],orderBy:[{field:{fieldPath:'score'},direction:'DESCENDING'}]}})});
    if(r.ok){
      const rows=await r.json();
      const docs=rows.filter(x=>x.document);
      if(docs.length>10)for(const d of docs.slice(10)){
        const docId=encodeURIComponent(d.document.name.split('/').pop());
        await fetch(fbURL+'/'+FB_COL+'/'+docId+'?key='+FB_API_KEY,{method:'DELETE'});
      }
    }
  }catch(e){}
}

class Game{
  constructor(canvas){
    this.canvas=canvas;this.ctx=canvas.getContext('2d');
    this.canvas.width=CW;this.canvas.height=CH;
    this.keys={};this.buf=[];
    this.frame=0;this.camX=0;this.shake=0;
    this.cc=0;this.ct=0;this.cd=0;this.cx=0;this.cy=0;
    this.hero=makeHero();this.enemies=[];this.pts=[];this.items=[];this.projs=[];
    this.spawnedItems=new Set();
    this.go=false;this.win=false;this.kills=0;this.hitStop=0;
    this.timeLeft=GAME_TIME;this.timeAcc=0;this.score=0;
    this.spawnTimer=SPAWN_INTERVAL;this.playerName='';this.lbSaved=false;
    this.paused=false;this.gugu=null;this.guguCD=0;this.healFx=null;
    window._game=this;
    this.setup();
  }
  setup(){
    window.addEventListener('keydown',e=>{
      const k=e.key.length===1?e.key.toLowerCase():e.key;
      this.keys[k]=true;
      if(['z','x','c','v','s','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(k)){
        this.buf.push({k,t:this.frame});if(this.buf.length>10)this.buf.shift()
      }
      if(k==='r'||k==='R')showNameModal();
      e.preventDefault();
    });
    window.addEventListener('keyup',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;this.keys[k]=false});
    this.setupMobile();
  }
  setupMobile(){
    const self=this;
    const joystick=document.getElementById('joystick');
    const knob=document.getElementById('joystickKnob');
    let jid=null;
    const clearJoy=()=>{jid=null;self.keys[KEY.U]=false;self.keys[KEY.D]=false;self.keys[KEY.L]=false;self.keys[KEY.R]=false;knob.style.transform='translate(0,0)'};
    const handleJoy=e=>{
      if(e.type==='touchstart'){if(e.target!==joystick&&!joystick.contains(e.target))return;jid=e.changedTouches[0].identifier}
      if(jid===null&&e.type!=='touchstart')return;
      e.preventDefault();
      const t=e.type==='touchstart'?e.changedTouches[0]:[...e.changedTouches].find(t=>t.identifier===jid);
      if(!t)return;
      if(e.type==='touchend'||e.type==='touchcancel'){clearJoy();return}
      const r=joystick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
      const dx=t.clientX-cx,dy=t.clientY-cy,dist=Math.sqrt(dx*dx+dy*dy),maxD=r.width/2,clam=Math.min(dist,maxD);
      const ang=Math.atan2(dy,dx);
      knob.style.transform=`translate(${Math.cos(ang)*clam}px,${Math.sin(ang)*clam}px)`;
      self.keys[KEY.U]=false;self.keys[KEY.D]=false;self.keys[KEY.L]=false;self.keys[KEY.R]=false;
      if(dist>20){
        const deg=ang*180/Math.PI;
        if(deg>-135&&deg<-45)self.keys[KEY.U]=true;
        else if(deg>-45&&deg<45)self.keys[KEY.R]=true;
        else if(deg>45&&deg<135)self.keys[KEY.D]=true;
        else self.keys[KEY.L]=true;
      }
    };
    joystick.addEventListener('touchstart',handleJoy,{passive:false});
    document.addEventListener('touchmove',handleJoy,{passive:false});
    document.addEventListener('touchend',handleJoy,{passive:false});
    document.addEventListener('touchcancel',handleJoy,{passive:false});
    document.querySelectorAll('.act-btn').forEach(btn=>{
      const key=btn.dataset.key;
      let bid=null;
      btn.addEventListener('touchstart',e=>{
        if(e.target!==btn&&!btn.contains(e.target))return;
        e.preventDefault();bid=e.changedTouches[0].identifier;
        if(key==='gugu'){self.keys['z']=true;self.keys['x']=true}
        else{self.keys[key]=true;if(key==='r')showNameModal()}
      },{passive:false});
      document.addEventListener('touchend',e=>{
        if(bid===null)return;
        const t=[...e.changedTouches].find(t=>t.identifier===bid);
        if(!t)return;bid=null;e.preventDefault();
        if(key==='gugu'){self.keys['z']=false;self.keys['x']=false}else self.keys[key]=false
      },{passive:false});
      document.addEventListener('touchcancel',e=>{
        if(bid===null)return;
        const t=[...e.changedTouches].find(t=>t.identifier===bid);
        if(!t)return;bid=null;e.preventDefault();
        if(key==='gugu'){self.keys['z']=false;self.keys['x']=false}else self.keys[key]=false
      },{passive:false});
    });
  }
  bufCheck(...ks){for(let i=this.buf.length-1;i>=0;i--){if(ks.includes(this.buf[i].k)&&this.frame-this.buf[i].t<10){this.buf.splice(i,1);return true}}return false}
  addP(x,y,col,c=8){for(let i=0;i<c;i++)this.pts.push({x,y,vx:(Math.random()-0.5)*8,vy:-Math.random()*8-2,life:1,decay:0.02+Math.random()*0.03,size:2+Math.random()*4,color:col})}
  pickItem(it){
    const h=this.hero,c=ITEM_CFG[it.t];
    if(c.heal){
      h.hp=Math.min(h.maxHp,h.hp+h.maxHp*0.1);
      it.picked=true;sfx('pick');this.addP(it.x,it.y-10,'#4c4',10);this.addP(it.x,it.y-10,'#8f8',6);
    }else{
      if(h.heldItems.length>=5)return;
      h.heldItems.push({type:it.t,uses:c.uses});
      it.picked=true;sfx('pick');this.addP(it.x,it.y-10,'#ff0',5);
    }
  }
  useItem(){
    const h=this.hero;
    if(!h.heldItems.length||h.itemCD>0)return;
    const item=h.heldItems[0],c=ITEM_CFG[item.type];
    const pY=h.y-55;
    if(item.type==='knife'){
      this.projs.push({x:h.x+h.facing*30,y:pY-50,vx:h.facing*14,vy:0,type:'knife',col:c.col,life:80,dmg:c.dmg,pierce:true,rot:0});
      sfx('throw');
    }else if(item.type==='grenade'){
      this.projs.push({x:h.x+h.facing*30,y:pY,vx:h.facing*6,vy:-7,type:'grenade',col:c.col,life:120,dmg:c.dmg,pierce:true,explode:true,rot:0,grounded:false,groundY:h.y});
      sfx('throw');
    }

            this.shake=12;sfx('combo');
            this.enemies.forEach(e=>{
              if(e.hp<=0)return;
              const dist=Math.abs(e.x-p.x);
              if(dist<120){
                const dmgFalloff=Math.max(0,1-dist/120);
                const finalDmg=Math.round(p.dmg*dmgFalloff);
                e.hp-=finalDmg;e.hitCD=18;e.flash=10;e.stun=15;
                e.vx=(e.x>p.x?1:-1)*8;e.vy=-6;
                this.addP(e.x,e.y,'#f80',10);this.addP(e.x,e.y,'#ff0',8);
                if(e.hp<=0)this.onEnemyKill(e);
              }
            });
            for(let i=0;i<20;i++)this.addP(p.x+(Math.random()-0.5)*40,p.y-10,'#f80',1);
            for(let i=0;i<14;i++)this.addP(p.x+(Math.random()-0.5)*60,p.y-5,'#ff0',1);
            for(let i=0;i<8;i++)this.addP(p.x+(Math.random()-0.5)*80,p.y,'#fff',1);
          }
        }
      }
    });
    this.projs=this.projs.filter(p=>p.life>0);
  }
  updPts(){this.pts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.1;p.life-=p.decay});this.pts=this.pts.filter(p=>p.life>0)}
  updCam(){const t=this.hero.x-CW*0.35;this.camX+=(t-this.camX)*0.08;this.camX=Math.max(0,Math.min(LEVEL_LEN-CW,this.camX))}
  updCombo(){if(this.ct>0){this.ct--;if(this.ct<=0)this.cc=0}if(this.cd>0)this.cd--}
  updHealFx(){
    if(!this.healFx||!this.healFx.active)return;
    this.healFx.timer--;
    if(this.healFx.timer<=0){
      this.healFx.frame++;
      if(this.healFx.frame>=HEAL_FX_FRAMES){this.healFx.active=false;return}
      this.healFx.timer=HEAL_FX_DUR;
    }
  }
  checkWin(){}

  render(){
    const ctx=this.ctx;ctx.save();
    if(this.shake>0.5)ctx.translate((Math.random()-0.5)*this.shake*2,(Math.random()-0.5)*this.shake*2);
    drawBg(ctx,this.camX);
    const all=[...this.enemies.filter(e=>e.hp>0),this.hero];
    all.sort((a,b)=>a.y-b.y);
    all.forEach(e=>{
      const sx=Math.round(e.x-this.camX),sy=Math.round(e.y);
      if(sx<-100||sx>CW+100)return;
      const fi=e.animFrame||0,fa=e.facing||1,fl=e.flash>0,st=e.animState||'idle';
      const gw=(e.type==='xiaowang'||e.type==='xiaowang2')&&(st==='kickfly'||e.charging);
      if(e===this.hero){
        drawHero(ctx,sx,sy,fi,fa,fl,st);
        if(this.healFx&&this.healFx.active)drawHealFx(ctx,sx,sy,this.healFx.frame,SCALE);
        if(e.flash>0&&e.flashColor){
          ctx.save();ctx.globalAlpha=0.4;ctx.fillStyle=e.flashColor;
          ctx.fillRect(sx-36,sy-96,72,96);ctx.restore();
        }
      }
      else drawEnemy(ctx,sx,sy,fi,fa,fl,st,e.type,gw);
    });
    this.enemies.filter(e=>e.hp>0).forEach(e=>{
      const sx=Math.round(e.x-this.camX),sy=Math.round(e.y);
      if(sx<-100||sx>CW+100)return;
      const bw=Math.min(e.w+10,46),bh=5,by=sy-(e.type==='xiaowang'||e.type==='xiaowang2'?155:e.type==='xiaoguai3'?140:e.type==='xiaoguai4'?145:e.type==='xiaoguai2'?165:110);
      drawHB(ctx,sx-bw/2,by,bw,bh,e.hp,e.maxHp,e.hp/e.maxHp>0.5?'#4c4':e.hp/e.maxHp>0.25?'#ea0':'#e44');
    });
    this.items.forEach(i=>{if(!i.picked){const ix=Math.round(i.x-this.camX);if(ix>-50&&ix<CW+50)drawItem(ctx,ix,i.y,i.t,this.frame)}});
    this.projs.forEach(p=>{const px=Math.round(p.x-this.camX);if(px>-50&&px<CW+50)drawProj(ctx,px,p.y,p.type,p.col,p.rot||0,p.sMul||1,p.fa||0)});
    this.enemies.filter(e=>e.hp<=0&&!e.animDone).forEach(e=>{
      const sx=Math.round(e.x-this.camX),sy=Math.round(e.y);ctx.globalAlpha=0.3;
      const fi=e.animFrame||0,fa=e.facing||1;
      drawEnemy(ctx,sx,sy,fi,fa,true,'death',e.type);
      ctx.globalAlpha=1
    });
    if(this.gugu&&this.gugu.hp>0){
      const g=this.gugu,gx=Math.round(g.x-this.camX),gy=Math.round(g.y);
      drawGugu(ctx,gx,gy,g.animFrame||0,g.facing||1,g.flash>0,g.animState||'idle');
      const bw=40,bh=5;
      ctx.fillStyle='#fff';ctx.font='bold 11px sans-serif';ctx.textAlign='center';
      ctx.fillText('姑姑',gx,gy-115);
      drawHB(ctx,gx-bw/2,gy-130,bw,bh,g.hp,g.maxHp,'#a855f7');
    }
    if(this.gugu&&this.gugu.hp<=0&&!this.gugu.animDone){
      const g=this.gugu,gx=Math.round(g.x-this.camX),gy=Math.round(g.y);
      ctx.globalAlpha=0.3;
      drawGugu(ctx,gx,gy,g.animFrame||0,g.facing||1,true,'death');
      ctx.globalAlpha=1;
    }
    drawParticles(ctx,this.pts,this.camX);
    const h=this.hero;
    drawHB(ctx,20,20,147,16,h.hp,h.maxHp,'#e74c3c','HP');
    const ultMax=ULT_COOLDOWN,ultCur=h.ultCD>0?ULT_COOLDOWN-h.ultCD:ULT_COOLDOWN;
    drawHB(ctx,20,42,100,11,ultCur,ultMax,h.ultCD<=0?'#f80':'#888','CD');
    drawHB(ctx,20,58,100,8,h.xp,h.xpToNext,'#9b59b6','XP');
    ctx.fillStyle='#fff';ctx.font='bold 11px sans-serif';ctx.textAlign='left';
    ctx.fillText('Lv.'+h.level,128,66);
    ctx.fillText(' '+h.playerName,128,66);
    if(this.guguCD>0){
      drawHB(ctx,20,72,100,8,1800-this.guguCD,1800,'#f0f','姑姑CD');
      ctx.fillStyle='#f0f';ctx.font='10px sans-serif';ctx.fillText(Math.ceil(this.guguCD/60)+'s',125,79);
    }else if(!this.gugu||this.gugu.hp<=0){
      ctx.fillStyle='#f0f';ctx.font='bold 10px sans-serif';ctx.fillText('姑姑可招喚(Z+X)',20,79);
    }
    const min=Math.floor(this.timeLeft/60),sec=this.timeLeft%60;
    ctx.fillStyle=this.timeLeft<=30?'#f44':'#fff';ctx.font='bold 24px sans-serif';ctx.textAlign='center';
    ctx.fillText((min<10?'0':'')+min+':'+(sec<10?'0':'')+sec,CW/2,35);
    ctx.fillStyle='#ff0';ctx.font='bold 16px sans-serif';ctx.textAlign='right';
    ctx.fillText('SCORE: '+this.score,CW-20,30);
    ctx.fillStyle='#f44';ctx.font='bold 12px sans-serif';ctx.textAlign='right';
    ctx.fillText('COMBO: '+this.cc,CW-20,55);
    ctx.fillStyle='#a855f7';ctx.fillText('擊殺: '+this.kills,CW-20,72);
    if(h.heldItems.length){ctx.fillStyle='#ff0';ctx.font='13px sans-serif';ctx.textAlign='right';ctx.fillText('道具['+h.heldItems.length+'/5]:',CW-20,95);h.heldItems.forEach((it,i)=>{const yOff=111+i*16;ctx.fillStyle=i===0?'#ff0':'#aaa';ctx.fillText(ITEM_CFG[it.type].name+'('+it.uses+'回) ',CW-22,yOff)});if(h.heldItems.length)ctx.fillStyle='#aaa';ctx.font='11px sans-serif';ctx.fillText('[S]使用最上方的道具',CW-20,111+h.heldItems.length*16)}
    if(this.cd>0&&this.cc>1)drawCmb(ctx,CW/2,70,this.cc);
    if(this.go){
      ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,CW,CH);
      ctx.fillStyle='#f44';ctx.font='bold 60px sans-serif';ctx.textAlign='center';
      ctx.fillText(this.timeLeft<=0?'TIME UP!':'GAME OVER',CW/2,CH/2-30);
      ctx.fillStyle='#fff';ctx.font='24px sans-serif';
      ctx.fillText('最終分數: '+this.score,CW/2,CH/2+20);
      ctx.fillStyle='#aaa';ctx.font='18px sans-serif';
      ctx.fillText('擊敗 '+this.kills+' 個敵人 | Lv.'+h.level,CW/2,CH/2+55);
      ctx.fillText('按 R 重新開始',CW/2,CH/2+85);
    }
    ctx.restore();
  }
  reset(){
    this.hero=makeHero();this.hero.playerName=this.playerName;
    this.enemies=[];this.pts=[];this.items=[];this.projs=[];
    this.spawnedItems=new Set();
    this.go=false;this.win=false;this.cc=0;this.ct=0;this.cd=0;this.kills=0;this.camX=0;this.shake=0;this.hitStop=0;
    this.timeLeft=GAME_TIME;this.timeAcc=0;this.score=0;
    this.spawnTimer=SPAWN_INTERVAL;this.lbSaved=false;this.paused=false;
    this.gugu=null;this.guguCD=0;this.healFx=null;
    pendingLevelUp=false;
  }
  start(){const loop=()=>{this.update();this.render();this.animId=requestAnimationFrame(loop)};loop()}
  stop(){if(this.animId)cancelAnimationFrame(this.animId)}
}

// ============================================================
// BOOT
// ============================================================
const canvas=document.getElementById('game');
function resize(){
  const mw=Math.min(window.innerWidth-40,540),r=600/540;
  canvas.style.width=mw+'px';canvas.style.height=(mw*r)+'px'
}
window.addEventListener('resize',resize);resize();

let gameInstance=null;
let pendingChar=null;
function goToCharSelect(){
  const name=document.getElementById('playerNameInput').value.trim();
  if(!name){document.getElementById('playerNameInput').style.borderColor='#f44';return}
  document.getElementById('playerNameInput').style.borderColor='#555';
  document.getElementById('nameModal').classList.remove('active');
  document.getElementById('charSelectModal').classList.add('active');
}
function selectCharacter(ch){
  selectedChar=ch;
  document.getElementById('charSelectModal').classList.remove('active');
  document.getElementById('playerNameInput').blur();
  document.activeElement&&document.activeElement.blur();
  document.getElementById('leaderboardBtn').style.display='block';
  const name=document.getElementById('playerNameInput').value.trim();
  if(!gameInstance){
    const fill=document.getElementById('loadingFill');
    const overlay=document.getElementById('loadingOverlay');
    let progress=0;
    function setProgress(p){progress=p;if(fill)fill.style.width=p+'%'}
    setProgress(10);
    loadHeroSprites(()=>{setProgress(16);loadHero2Sprites(()=>{setProgress(28);loadHealFxSprites(()=>{setProgress(34);loadQigongImages(()=>{setProgress(38);loadXiaoguai1Sprites(()=>{setProgress(44);loadXiaoguai2Sprites(()=>{setProgress(50);loadXiaoguai3Sprites(()=>{setProgress(56);loadXiaoguai4Sprites(()=>{setProgress(62);loadXiaowangSprites(()=>{setProgress(68);loadXiaowang2Sprites(()=>{setProgress(72);loadGuguSprites(()=>{setProgress(78);loadSceneImages(()=>{setProgress(86);loadItemImages(()=>{
      setProgress(100);
      if(overlay)overlay.classList.add('hide');
      setTimeout(()=>{if(overlay)overlay.style.display='none'},600);
      gameInstance=new Game(canvas);
      gameInstance.playerName=name;
      gameInstance.hero.playerName=name;
      gameInstance.start();
    })    })})})})})})})})})})})});
  }else{
    gameInstance.playerName=name;
    gameInstance.reset();
  }
}
function showNameModal(){
  document.getElementById('charSelectModal').classList.remove('active');
  document.getElementById('nameModal').classList.add('active');
  document.getElementById('playerNameInput').value='';
  document.getElementById('playerNameInput').style.borderColor='#555';
  document.getElementById('leaderboardBtn').style.display='none';
  renderNameRank();
  if(gameInstance){gameInstance.stop();gameInstance=null}
}
document.getElementById('playerNameInput').addEventListener('keydown',e=>{
  if(e.key==='Enter')goToCharSelect();
  e.stopPropagation();
});
document.getElementById('leaderboardBtn').style.display='none';
renderNameRank();
</script>
