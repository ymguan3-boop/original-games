<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>阿宏與星輝法師 · Blender 角色工坊</title><style>*{box-sizing:border-box}body{margin:0;background:#faf0d8;color:#49361f;font:15px system-ui}header{position:absolute;top:20px;left:26px;z-index:2}h1{margin:0;font-size:25px}p{color:#8b7457;font-size:13px;margin:7px 0}canvas{display:block;width:100vw;height:100vh}footer{position:absolute;bottom:18px;left:20px;right:20px;display:flex;gap:16px}.card{flex:1;padding:16px;background:#fffaf0ed;border:1px solid #dfcda8;border-radius:16px}.card h2{margin:0 0 5px;font-size:20px}button,a{display:inline-block;border:1px solid #ddc99f;background:#fff5dc;border-radius:7px;color:#694323;padding:7px 12px;font:12px system-ui;cursor:pointer;margin:4px 3px 0 0;text-decoration:none}button:hover{background:#e9c882}.active{background:#e9bd73}#status{position:absolute;right:24px;top:24px;color:#917b5a;font-size:12px}@media(max-width:650px){footer{gap:7px;left:8px;right:8px}.card{padding:10px}.card p{display:none}button,a{padding:5px 7px}}</style>
<header><h1>阿宏牛仔 × 藍金星輝法師</h1><p>Blender 原生建模 · 拖曳旋轉 / 滾輪縮放</p><button onclick="view(0)">正面</button><button onclick="view(1.57)">側面</button><button onclick="view(3.14)">背面</button><button onclick="paused=!paused">暫停 / 播放</button></header><span id="status">載入模型…</span><canvas id="stage"></canvas><footer id="cards"></footer>
<script src="../../vendor/three.min.js"></script><script src="../../vendor/GLTFLoader.js"></script><script src="../../js/duo-combat-vfx.js"></script><script>
const T=THREE,r=new T.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true,preserveDrawingBuffer:true});r.setPixelRatio(Math.min(2,devicePixelRatio));r.outputEncoding=T.sRGBEncoding;r.toneMapping=T.ACESFilmicToneMapping;r.toneMappingExposure=.87;r.shadowMap.enabled=true;r.shadowMap.type=T.PCFSoftShadowMap;
const scene=new T.Scene();scene.background=new T.Color('#faf0d8');const camera=new T.PerspectiveCamera(34,1,.01,60);let yaw=.08,pitch=.15,distance=7,paused=false;
scene.add(new T.HemisphereLight(0xffffed,0xa58b66,.7));for(const [color,power,pos]of [[0xffeee0,1.3,[-3,7,5]],[0xd2e3ff,.9,[4,4,1]],[0xffdda0,1.8,[0,5,-4]]]){let l=new T.DirectionalLight(color,power);l.position.set(...pos);if(pos[0]===-3){l.castShadow=true;l.shadow.mapSize.set(2048,2048);l.shadow.camera.left=-4;l.shadow.camera.right=4;l.shadow.bias=-.0004;}scene.add(l);}
const env=new T.Scene();env.background=new T.Color('#bfb5a7');for(const x of [-3,3]){const m=new T.Mesh(new T.BoxGeometry(2,5,2),new T.MeshBasicMaterial({color:0xffffff}));m.position.set(x,3,2);env.add(m);}scene.environment=new T.PMREMGenerator(r).fromScene(env,.1).texture;
const floor=new T.Mesh(new T.PlaneGeometry(100,100),new T.MeshStandardMaterial({color:0xf0dfb7,roughness:.9}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;floor.position.y=-.005;scene.add(floor);
const entries=[{id:'ahong-cowboy',name:'阿宏牛仔',desc:'高度 1.70 · 雙槍快射 / 六芒追星連射',height:1.7},{id:'starlight-mage',name:'藍金星輝法師',desc:'高度 2.332 · 星芒矢 / 天穹星陣',height:2.332}],actors=[];
const labels={Idle:'待機',Walk:'行走',Run:'跑步',Attack:'普攻',Ultimate:'大絕',Hurt:'受擊',Wave:'招呼',React:'致意',Jump:'跳躍'};
function play(i,name){const a=actors[i];a.mixer.stopAllAction();a.action=a.mixer.clipAction(a.clips.find(c=>c.name===name));a.action.reset().play();a.mode=name;}
function view(n){yaw=n;}
Promise.all(entries.map(async(e,i)=>{const g=await new T.GLTFLoader().loadAsync('../../models/spirits/'+e.id+'.glb');const root=new T.Group();root.position.x=i?1.05:-1.05;scene.add(root);root.add(g.scene);g.scene.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;o.frustumCulled=false;}});const a={root,model:g.scene,clips:g.animations,mixer:new T.AnimationMixer(g.scene)};actors[i]=a;a.fx=window.createDuoCombatVFX?.(T,root,g.scene,e.id);const c=document.createElement('section');c.className='card';c.dataset.index=i;c.style.order=i;c.innerHTML='<h2>'+e.name+'</h2><p>'+e.desc+'</p>';for(const name of Object.keys(labels)){const b=document.createElement('button');b.textContent=labels[name];b.onclick=()=>play(i,name);c.append(b);}c.innerHTML+='<br><a href="../../models/spirits/'+e.id+'.glb" download>GLB ↓</a><a href="'+e.id+'.blend" download>Blender 原檔 ↓</a>';document.querySelector('#cards').append(c);c.querySelectorAll('button').forEach((b,j)=>b.onclick=()=>play(i,Object.keys(labels)[j]));play(i,'Idle');})).then(()=>{document.querySelector('#status').textContent='2 支模型 · 各 9 個動作';window.__ready=true;});
let drag;stage.onpointerdown=e=>{drag=[e.clientX,e.clientY];stage.setPointerCapture(e.pointerId)};stage.onpointerup=()=>drag=null;stage.onpointermove=e=>{if(drag){yaw-=(e.clientX-drag[0])*.008;pitch=Math.max(-.2,Math.min(.7,pitch+(e.clientY-drag[1])*.005));drag=[e.clientX,e.clientY];}};stage.onwheel=e=>{e.preventDefault();distance=Math.max(3,Math.min(12,distance*Math.exp(e.deltaY*.001)));};
function render(){camera.position.set(Math.sin(yaw)*distance,1.1+Math.sin(pitch)*distance,Math.cos(yaw)*distance);camera.lookAt(0,1.05,0);r.render(scene,camera);}function resize(){r.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}onresize=resize;resize();const clock=new T.Clock();function tick(){requestAnimationFrame(tick);const dt=Math.min(.05,clock.getDelta());for(const a of actors){if(!a)continue;if(!paused)a.mixer.update(dt);a.fx?.update(a.mode,a.action.time);}render();}tick();window.DUO={actors,entries,play,render,seek(i,name,t){paused=true;play(i,name);actors[i].action.time=t;actors[i].mixer.update(0);actors[i].fx?.update(name,t);render();}};
</script></html>
