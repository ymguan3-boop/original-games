<title>火猴雙階</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 版面：左邊大舞台（3D 即時模型）＋右邊原畫與角色卡；手機時上下堆疊。配色取自火猴本身：朱紅、金箍金、炭灰 */
:root {
  --bg: #EDEEF0;
  --surface: #FFFFFF;
  --stage: radial-gradient(120% 90% at 50% 20%, #FFFFFF 0%, #E4E6EA 70%);
  --fg: #1F2328;
  --muted: #5D6570;
  --line: #D5D8DE;
  --accent: #C8322A;
  --accent-fg: #FFFFFF;
  --gold: #A9771C;
  --chip: #F4F5F7;
  --display: 'Noto Serif TC', 'Songti TC', 'PMingLiU', serif;
  --body: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #15171B; --surface: #1D2026; --stage: radial-gradient(120% 90% at 50% 20%, #2A2E36 0%, #17191E 72%);
  --fg: #ECEAE6; --muted: #A2A8B2; --line: #30343C; --accent: #E5533F; --accent-fg: #FFFFFF; --gold: #E0B24E; --chip: #24282F; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #15171B; --surface: #1D2026; --stage: radial-gradient(120% 90% at 50% 20%, #2A2E36 0%, #17191E 72%);
  --fg: #ECEAE6; --muted: #A2A8B2; --line: #30343C; --accent: #E5533F; --accent-fg: #FFFFFF; --gold: #E0B24E; --chip: #24282F; color-scheme: dark;
}
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--body); line-height: 1.6; }
.wrap { max-width: 1180px; margin: 0 auto; padding-block: 28px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 20px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; }
h1 { font-family: var(--display); font-weight: 900; font-size: clamp(28px, 4vw, 40px); margin: 0; letter-spacing: 0.04em; text-wrap: balance; }
.lede { margin: 0; color: var(--muted); max-width: 62ch; }
.who { display: flex; flex-wrap: wrap; gap: 8px; }
.who button { font: 700 16px var(--body); padding: 8px 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; display: inline-flex; gap: 8px; align-items: baseline; }
.who button small { font-weight: 500; font-size: 12px; color: var(--muted); letter-spacing: 0.08em; }
.who button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.who button[aria-pressed="true"] small { color: var(--accent-fg); opacity: 0.85; }
.main { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; align-items: start; }
.stage { position: relative; background: var(--stage); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; aspect-ratio: 4 / 3; max-width: 100%; }
.stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.hint { position: absolute; left: 12px; bottom: 10px; font-size: 12px; color: var(--muted); pointer-events: none; }
.now { position: absolute; left: 14px; top: 12px; font-family: var(--display); font-weight: 700; font-size: 18px; pointer-events: none; }
.acts { display: grid; gap: 10px; }
.group { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.group h2 { font-size: 12px; letter-spacing: 0.12em; color: var(--muted); margin: 0 6px 0 0; font-weight: 500; min-width: 4.5em; }
.group button { font: 500 14px var(--body); padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--chip); color: var(--fg); cursor: pointer; }
.group.moves button { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.group button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.desc { margin: 0; color: var(--muted); font-size: 14px; min-height: 1.6em; }
aside { display: grid; gap: 14px; }
.ref { margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.ref div { aspect-ratio: 3 / 4; background-image: url(ref/monkeys.webp); background-repeat: no-repeat; background-size: 200% auto; }
.ref figcaption { font-size: 12px; color: var(--muted); padding: 8px 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: grid; gap: 8px; }
.card h3 { margin: 0; font-family: var(--display); font-size: 22px; display: flex; gap: 10px; align-items: baseline; }
.card h3 span { font-family: var(--body); font-size: 12px; font-weight: 700; color: var(--gold); letter-spacing: 0.1em; }
.card dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: 14px; }
.card dt { color: var(--muted); }
.card dd { margin: 0; }
.card p { margin: 0; font-size: 14px; }
.foot { font-size: 12px; color: var(--muted); }
@media (max-width: 860px) { .main { grid-template-columns: minmax(0, 1fr); } aside { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .stage { aspect-ratio: 1 / 1; } }
@media (max-width: 520px) { aside { grid-template-columns: minmax(0, 1fr); } .ref div { aspect-ratio: 4 / 3; background-position-y: 30% !important; } }
</style>

<div class="wrap">
  <header>
    <h1>火猴雙階</h1>
    <p class="lede">C囝仔與 C老猴的 Three.js 即時模型。兩隻都以主角小男孩的骨架為架構建模，主角的動作可直接套用；另外各有自己的普攻與大絕。</p>
  </header>
  <div class="who" role="group" aria-label="角色">
    <button type="button" id="who-kid" aria-pressed="true">C囝仔 <small>1 階</small></button>
    <button type="button" id="who-elder" aria-pressed="false">C老猴 <small>2 階</small></button>
  </div>
  <div class="main">
    <div class="acts">
      <div class="stage" id="stage"><div class="now" id="now">小火球（普攻）</div><div class="hint">拖曳旋轉 · 滾輪或雙指縮放</div></div>
      <div class="group moves" role="group" aria-label="招式"><h2>招式</h2><div class="group" id="g-moves"></div></div>
      <div class="group" role="group" aria-label="基本動作"><h2>基本動作</h2><div class="group" id="g-basic"></div></div>
      <p class="desc" id="desc"></p>
    </div>
    <aside>
      <figure class="ref"><div id="refImg" role="img" aria-label="原畫"></div><figcaption id="refCap">原畫：C囝仔</figcaption></figure>
      <div class="card">
        <h3 id="cardName">C囝仔 <span>火 · 稀有 · 守護者</span></h3>
        <p id="cardText"></p>
        <dl id="cardStats"></dl>
      </div>
      <p class="foot">尾巴七節會跟著擺動、尾端火焰會跳動；招式附火球、棍光、地面震動等即時特效。</p>
    </aside>
  </div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { buildBird as buildModel, buildClips } from '../kid-hero/builder.js';

const KB = window.KID_BLUEPRINT, MB = window.MONKEY_BLUEPRINT, MA = window.MONKEY_ACTIONS;
const BASIC = ['idle', 'walk', 'run', 'wave', 'cheer1', 'hurt'];
const INFO = {
  kid: { name: 'C囝仔', ref: '0%', stats: [['屬性', '火'], ['階級', '1 階（可進化成 C老猴）'], ['普攻', '小火球：過肩丟出'], ['大絕', '大火球：頭頂蓄成大火球擲出']] },
  elder: { name: 'C老猴', ref: '100%', stats: [['屬性', '火'], ['階級', '2 階'], ['普攻', '伸棍打：劈下後金箍棒伸長'], ['大絕', '三連棍：橫掃、劈地、突刺']] },
};

// ---------- 場景
const host = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
host.prepend(renderer.domElement);
const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
const envScene = new THREE.Scene(); envScene.background = new THREE.Color('#ECEDEF');
scene.environment = pmrem.fromScene(envScene).texture;
scene.environmentIntensity = 0.95;
const camera = new THREE.PerspectiveCamera(30, 4 / 3, 0.1, 100);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.minDistance = 2; controls.maxDistance = 14;
const key = new THREE.DirectionalLight(0xffffff, 2.5);
key.position.set(-4.4, 6.4, 6.3); key.castShadow = true; key.shadow.mapSize.set(2048, 2048); key.shadow.radius = 5; key.shadow.bias = -0.0004;
Object.assign(key.shadow.camera, { left: -3, right: 3, top: 3.5, bottom: -1.5, near: 1, far: 22 });
scene.add(key);
const rim = new THREE.DirectionalLight(0xffffff, 0.8); rim.position.set(-4, 5, -5); scene.add(rim);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.ShadowMaterial({ opacity: 0.2 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
function resize() { const r = host.getBoundingClientRect(); renderer.setSize(r.width, r.height, false); camera.aspect = r.width / r.height; camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(host);

// ---------- 兩隻角色：各自的模型、動作片段、尾巴節點
const staffFactory = buildModel({ materials: KB.PROP_MATERIALS ? Object.assign({}, KB.PROP_MATERIALS, MB.STAFF_MATERIALS) : MB.STAFF_MATERIALS, parts: MB.STAFF.parts });
staffFactory.traverse((o) => { if (o.isMesh) o.castShadow = true; });
const chars = {};
for (const who of ['kid', 'elder']) {
  const model = buildModel(MB.CHARACTERS[who]);
  model.visible = false; scene.add(model);
  const actions = [...KB.ACTIONS.filter((a) => BASIC.includes(a.id)), ...MA[who]];
  const mixer = new THREE.AnimationMixer(model), clips = buildClips(actions, model);
  const sockets = { propR: model.getObjectByName('propR'), propL: model.getObjectByName('propL') };
  if (who === 'elder') { const st = staffFactory.clone(); st.name = 'staff'; sockets.propR.add(st); }
  chars[who] = { model, actions, mixer, clips, sockets, current: null,
    tail: Array.from({ length: MB.TAIL.joints }, (_, i) => model.getObjectByName('tail' + i)).filter(Boolean),
    flame: model.getObjectByName(MB.TAIL.flame), staff: who === 'elder' ? sockets.propR.getObjectByName('staff') : null };
}
let who = 'kid', act = MA.kid[0].id;
const C = () => chars[who];
const A = () => C().actions.find((a) => a.id === act);

function play(id) {
  const c = C(); act = id;
  const next = c.mixer.clipAction(c.clips[id]);
  if (c.current !== next) { if (c.current) c.current.fadeOut(0.25); next.reset().setEffectiveWeight(1).fadeIn(0.25).play(); c.current = next; }
  const a = A();
  document.getElementById('now').textContent = a.name;
  document.getElementById('desc').textContent = a.desc;
  document.querySelectorAll('#g-moves button, #g-basic button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.id === id));
  prevU = null;
}
function renderButtons() {
  const mk = (box, list) => { box.replaceChildren(...list.map((a) => { const b = document.createElement('button'); b.type = 'button'; b.id = 'act-' + a.id; b.dataset.id = a.id; b.textContent = a.name; b.onclick = () => play(a.id); return b; })); };
  mk(document.getElementById('g-moves'), MA[who]);
  mk(document.getElementById('g-basic'), C().actions.filter((a) => BASIC.includes(a.id)));
}
function setWho(w) {
  who = w;
  for (const k in chars) chars[k].model.visible = k === w;
  document.getElementById('who-kid').setAttribute('aria-pressed', w === 'kid');
  document.getElementById('who-elder').setAttribute('aria-pressed', w === 'elder');
  const info = INFO[w], ch = MB.CHARACTERS[w];
  document.getElementById('refImg').style.backgroundPosition = `${info.ref} 30%`;
  document.getElementById('refCap').textContent = '原畫：' + info.name;
  document.getElementById('cardName').firstChild.textContent = info.name + ' ';
  document.getElementById('cardText').textContent = MB.DESC[w];
  document.getElementById('cardStats').innerHTML = info.stats.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('');
  renderButtons();
  play(MA[w][0].id);
  camera.position.set(2.2, 1.6, 6.4); controls.target.set(0, w === 'kid' ? 0.95 : 1.1, 0); controls.update();
  try { localStorage.setItem('fire-monkey-who', w); } catch (e) {}
}
document.getElementById('who-kid').onclick = () => setWho('kid');
document.getElementById('who-elder').onclick = () => setWho('elder');

// ---------- 特效：煙霧／火花、地面衝擊波、火球、棍子伸長
const puffTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.5, 'rgba(255,255,255,0.5)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
})();
const puffs = [], rings = [];
let shake = 0;
function puff(p, v, color, size0, size1, life, opacity) {
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: puffTex, color, transparent: true, depthWrite: false, opacity }));
  sp.position.copy(p); sp.scale.setScalar(size0); scene.add(sp);
  puffs.push({ sp, v, size0, size1, life, age: 0, opacity });
}
function shockwave(p) {
  for (const [delay, color] of [[0, '#8C7A66'], [0.12, '#B8A68E']]) {
    const m = new THREE.Mesh(new THREE.RingGeometry(0.8, 1, 64), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0, side: THREE.DoubleSide, depthWrite: false }));
    m.rotation.x = -Math.PI / 2; m.position.set(p.x, 0.004, p.z); scene.add(m); rings.push({ m, age: -delay });
  }
  for (let i = 0; i < 14; i++) {
    const a = (i / 14) * Math.PI * 2 + Math.random() * 0.3, s = 0.9 + Math.random() * 0.8;
    puff(new THREE.Vector3(p.x, 0.05, p.z), new THREE.Vector3(Math.cos(a) * s, 0.5 + Math.random() * 0.6, Math.sin(a) * s), '#A89580', 0.12, 0.5, 0.9 + Math.random() * 0.4, 0.75);
  }
}
const fireMats = {};
const fireMat = (c, o) => (fireMats[c + o] ||= new THREE.MeshBasicMaterial({ color: c, transparent: true, opacity: o, blending: THREE.AdditiveBlending, depthWrite: false }));
const ballGeo = new THREE.SphereGeometry(1, 24, 16);
function makeFireball() {
  const g = new THREE.Group();
  const core = new THREE.Mesh(ballGeo, new THREE.MeshBasicMaterial({ color: '#FFE38A' }));
  const mid = new THREE.Mesh(ballGeo, fireMat('#FF8A1E', 0.75)); mid.scale.setScalar(1.35);
  const out = new THREE.Mesh(ballGeo, fireMat('#E8341C', 0.4)); out.scale.setScalar(1.8);
  const light = new THREE.PointLight('#FF8A2A', 0, 4);
  g.add(core, mid, out, light); g.userData = { mid, out, light }; g.visible = false; scene.add(g);
  return g;
}
function setBall(b, r, t) {
  b.scale.setScalar(Math.max(r, 0.001));
  const f = 1 + 0.08 * Math.sin(t * 31) + 0.05 * Math.sin(t * 17);
  b.userData.mid.scale.setScalar(1.35 * f); b.userData.out.scale.setScalar(1.8 * (2 - f)); b.userData.light.intensity = 6 * r;
}
const heldBall = makeFireball(), flying = [];
const tA = new THREE.Vector3(), tB = new THREE.Vector3(), fwd = new THREE.Vector3();
function cur() {
  const c = C(), a = A();
  if (!c.current || !a) return null;
  const d = c.current.getClip().duration;
  return { a, u: (c.current.time % d) / d };
}
const extAt = (s) => (s && s.a.ext ? s.a.ext[Math.min(s.a.ext.length - 1, Math.round(s.u * s.a.frames))] : 0);
function heldPos(fx, r) {
  const c = C();
  if (fx.kind === 'small') return c.sockets.propR.getWorldPosition(tA).add(new THREE.Vector3(0, 0.1, 0));
  c.model.getObjectByName('head').getWorldPosition(tB);     // 大火球浮在頭頂上方
  return tA.set(tB.x, tB.y + 1.0 + r, tB.z);
}
function explode(p, big) {
  for (let i = 0; i < (big ? 26 : 12); i++) puff(p.clone(), new THREE.Vector3(Math.random() - 0.5, Math.random() * 0.8, Math.random() - 0.5).multiplyScalar(big ? 3 : 1.6), ['#FFB13B', '#FF6A1E', '#E8341C'][i % 3], big ? 0.2 : 0.1, big ? 0.9 : 0.45, 0.5 + Math.random() * 0.4, 0.9);
  for (let i = 0; i < (big ? 8 : 4); i++) puff(p.clone(), new THREE.Vector3((Math.random() - 0.5) * 0.4, 0.4 + Math.random() * 0.3, (Math.random() - 0.5) * 0.4), '#8D8D8D', 0.15, big ? 1.1 : 0.6, 1.4, 0.5);
  if (big) { shockwave(new THREE.Vector3(p.x, 0.01, p.z)); shake = 0.45; }
}
function onEvent(type, s) {
  const c = C(); c.model.updateMatrixWorld(true);
  if (type === 'fireSmall' || type === 'fireBig') {
    const big = type === 'fireBig', b = makeFireball();
    b.position.copy(heldBall.position); b.visible = true;
    fwd.set(0, 0, 1).applyQuaternion(c.model.quaternion);
    flying.push({ b, v: fwd.clone().multiplyScalar(big ? 4.5 : 6).add(new THREE.Vector3(0, big ? 0.3 : 0.6, 0)), r: big ? 0.36 : 0.1, age: 0, big });
    heldBall.visible = false;
  } else {
    const p = tA.set(0, 0, 1.05 + extAt(s)).applyMatrix4(c.sockets.propR.matrixWorld).clone();
    for (let i = 0; i < 10; i++) puff(p.clone(), new THREE.Vector3(Math.random() - 0.5, Math.random() * 0.8, Math.random() - 0.5).multiplyScalar(1.6), i % 2 ? '#FFB13B' : '#FF6A1E', 0.06, 0.32, 0.45, 0.9);
    if (type === 'quake') { shake = 0.6; shockwave(new THREE.Vector3(p.x, 0.01, p.z)); }
  }
}
let prevU = null;
function fxStep(dt, now) {
  const c = C(), s = cur();
  c.model.updateMatrixWorld(true);
  // 動作事件（出手、擊中、劈地）
  if (s && s.a.events && s.a.events.length) {
    if (prevU !== null && s.u !== prevU) for (const [eu, type] of s.a.events) {
      const crossed = prevU <= s.u ? prevU < eu && eu <= s.u : eu > prevU || eu <= s.u;
      if (crossed) onEvent(type, s);
    }
    prevU = s.u;
  }
  // 火球蓄力
  const fx = s && s.a.fx;
  if (fx && s.u >= fx.from && s.u < fx.release) {
    const grow = fx.kind === 'small' ? Math.min(1, (s.u - fx.from) / 0.08) * 0.1 : 0.05 + 0.31 * Math.min(1, (s.u - fx.from) / (fx.full - fx.from));
    heldBall.position.copy(heldPos(fx, grow)); heldBall.visible = true; setBall(heldBall, grow, now);
    if (Math.random() < dt * (fx.kind === 'small' ? 10 : 30)) puff(heldBall.position.clone(), new THREE.Vector3((Math.random() - 0.5) * 0.3, 0.6, (Math.random() - 0.5) * 0.3), '#FF8A1E', grow * 0.6, grow * 1.4, 0.5, 0.7);
  } else heldBall.visible = false;
  for (let i = flying.length - 1; i >= 0; i--) {
    const f = flying[i]; f.age += dt; f.v.y -= (f.big ? 0.3 : 1.2) * dt;
    f.b.position.addScaledVector(f.v, dt); setBall(f.b, f.r, now);
    if (Math.random() < dt * 40) puff(f.b.position.clone(), new THREE.Vector3(0, 0.3, 0), '#FF6A1E', f.r * 0.7, f.r * 1.5, 0.4, 0.6);
    if (f.age > (f.big ? 1.3 : 0.9) || f.b.position.y < f.r * 0.5) { explode(f.b.position, f.big); scene.remove(f.b); flying.splice(i, 1); }
  }
  // 金箍棒伸長
  if (c.staff) {
    const ext = extAt(s);
    c.staff.getObjectByName('staffShaft').scale.z = (1.6 + ext) / 1.6;
    c.staff.getObjectByName('staffFront').position.z = ext;
    if (ext > 0.3 && Math.random() < dt * 30) puff(tA.set(0, 0, 1.05 + ext).applyMatrix4(c.sockets.propR.matrixWorld).clone(), new THREE.Vector3(0, 0.2, 0), '#FF8A2A', 0.05, 0.22, 0.35, 0.8);
  }
  // 尾巴擺動、尾端火焰跳動
  c.tail.forEach((n, i) => { const ph = now * 2.4 - i * 0.55; n.rotation.set(0.06 * Math.sin(ph + 1), 0.1 * Math.sin(ph), 0.07 * Math.sin(ph * 0.8)); });
  if (c.flame) { const f = 1 + 0.12 * Math.sin(now * 13) + 0.06 * Math.sin(now * 21); c.flame.scale.set(1 / Math.sqrt(f), f, 1 / Math.sqrt(f)); }
  // 煙霧、衝擊波
  for (let i = puffs.length - 1; i >= 0; i--) {
    const p = puffs[i]; p.age += dt; const t = p.age / p.life;
    if (t >= 1) { scene.remove(p.sp); p.sp.material.dispose(); puffs.splice(i, 1); continue; }
    p.sp.position.addScaledVector(p.v, dt); p.v.multiplyScalar(Math.pow(0.25, dt)); p.v.y += 0.05 * dt;
    p.sp.scale.setScalar(p.size0 + (p.size1 - p.size0) * (1 - (1 - t) * (1 - t))); p.sp.material.opacity = p.opacity * (1 - t);
  }
  for (let i = rings.length - 1; i >= 0; i--) {
    const r = rings[i]; r.age += dt; const t = r.age / 0.7;
    if (t >= 1) { scene.remove(r.m); r.m.geometry.dispose(); r.m.material.dispose(); rings.splice(i, 1); continue; }
    if (t < 0) continue;
    r.m.scale.setScalar(0.15 + 1.7 * t); r.m.material.opacity = 0.8 * (1 - t);
  }
}

// ---------- 迴圈
const clock = new THREE.Clock(), shakeOff = new THREE.Vector3();
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
function step(dt, now) {
  C().mixer.update(dt);
  controls.update();
  fxStep(dt, now);
  if (shake > 0 && !reduce) {
    shake = Math.max(0, shake - dt);
    const amp = 0.09 * (shake / 0.6) ** 1.5;
    shakeOff.set((Math.random() - 0.5) * amp, (Math.random() - 0.5) * amp, 0);
    camera.position.add(shakeOff); renderer.render(scene, camera); camera.position.sub(shakeOff);
  } else renderer.render(scene, camera);
}
renderer.setAnimationLoop((t) => step(Math.min(clock.getDelta(), 0.1), t / 1000));
window.__show = { step, chars, setWho, play, renderer, camera, scene };
let start = 'kid';
try { if (localStorage.getItem('fire-monkey-who') === 'elder') start = 'elder'; } catch (e) {}
resize();
setWho(start);
</script>
