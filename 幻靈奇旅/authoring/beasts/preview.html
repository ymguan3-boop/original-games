<title>火熊與貓娘</title>

<style>

:root {

  --fg: #1F2328;

  --line: #D4D7DD;
  --bear: #D2561E;
  --cat: #B8242C;
  --accent-fg: #FFFFFF;
  --chip: #F4F5F7;
  --display: 'Noto Serif TC', 'Songti TC', 'PMingLiU', serif;
  --body: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #15171B; --surface: #1D2026; --stage: radial-gradient(120% 90% at 50% 20%, #2A2E36 0%, #17191E 72%);
  --fg: #ECEAE6; --muted: #A2A8B2; --line: #30343C; --bear: #F07A3A; --cat: #E5535B; --accent-fg: #FFFFFF; --chip: #24282F; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #15171B; --surface: #1D2026; --stage: radial-gradient(120% 90% at 50% 20%, #2A2E36 0%, #17191E 72%);
  --fg: #ECEAE6; --muted: #A2A8B2; --line: #30343C; --bear: #F07A3A; --cat: #E5535B; --accent-fg: #FFFFFF; --chip: #24282F; color-scheme: dark;
}
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--body); line-height: 1.6; }
.wrap { max-width: 1180px; margin: 0 auto; padding-block: 28px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 18px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; }
h1 { font-family: var(--display); font-weight: 900; font-size: clamp(28px, 4vw, 40px); margin: 0; letter-spacing: 0.04em; text-wrap: balance; }
.lede { margin: 0; color: var(--muted); max-width: 64ch; }
.fams { display: flex; flex-wrap: wrap; gap: 10px 22px; }
.fam { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.fam h2 { margin: 0 4px 0 0; font-size: 12px; letter-spacing: 0.14em; color: var(--muted); font-weight: 500; }
.fam button { font: 700 15px var(--body); padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; display: inline-flex; gap: 6px; align-items: baseline; }
.fam button small { font-weight: 500; font-size: 11px; color: var(--muted); letter-spacing: 0.08em; }
.fam.bear button[aria-pressed="true"] { background: var(--bear); border-color: var(--bear); color: var(--accent-fg); }
.fam.cat button[aria-pressed="true"] { background: var(--cat); border-color: var(--cat); color: var(--accent-fg); }
.fam button[aria-pressed="true"] small { color: var(--accent-fg); opacity: 0.85; }
.fam .arrow { color: var(--muted); font-size: 12px; }
.main { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; align-items: start; }
.acts { display: grid; gap: 10px; min-width: 0; }
.stage { position: relative; background: var(--stage); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; aspect-ratio: 4 / 3; max-width: 100%; }
.stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.hint { position: absolute; left: 12px; bottom: 10px; font-size: 12px; color: var(--muted); pointer-events: none; }
.buff { position: absolute; right: 12px; top: 12px; padding: 6px 12px; border-radius: 999px; background: color-mix(in srgb, #F2A82A 88%, transparent); color: #3A2200; font-weight: 700; font-size: 13px; letter-spacing: 0.04em; pointer-events: none; box-shadow: 0 0 0 2px #FFE08A, 0 0 18px #F2A82A; }
.now { position: absolute; left: 14px; top: 12px; font-family: var(--display); font-weight: 700; font-size: 18px; pointer-events: none; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.row h3 { font-size: 12px; letter-spacing: 0.12em; color: var(--muted); margin: 0 6px 0 0; font-weight: 500; min-width: 4.5em; }
.row button { font: 500 14px var(--body); padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--chip); color: var(--fg); cursor: pointer; }
.row.moves button { border-color: color-mix(in srgb, var(--tone, var(--bear)) 50%, var(--line)); }
.row button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
button:focus-visible { outline: 2px solid var(--tone, var(--bear)); outline-offset: 2px; }
.desc { margin: 0; color: var(--muted); font-size: 14px; min-height: 3.2em; }

.ref { margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }

@media (max-width: 860px) { .main { grid-template-columns: minmax(0, 1fr); } aside { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .stage { aspect-ratio: 1 / 1; } }
@media (max-width: 520px) { aside { grid-template-columns: minmax(0, 1fr); } }

<div class="wrap" id="wrap">
  <header>
    <h1>火熊與貓娘</h1>

  <div class="fams">

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { buildBird as buildModel, buildClips } from '../kid-hero/builder.js';

const KB = window.KID_BLUEPRINT, BE = window.BEASTS, BA = window.BEAST_ACTIONS;
const HERO_BASIC = { idle: '站立', walk: '行走', run: '跑步', wave: '打招呼', cheer1: '歡呼', hurt: '受擊' };
const REF = { bear1: ['bears', '0%'], bear2: ['bears', '50%'], bear3: ['bears', '100%'], cat1: ['cats', '0%'], cat2: ['cats', '50%'], cat3: ['cats', '100%'] };

// ---------- 場景
const host = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
host.prepend(renderer.domElement);
const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
const envScene = new THREE.Scene(); envScene.background = new THREE.Color('#ECEDEF');
scene.environment = pmrem.fromScene(envScene).texture;
scene.environmentIntensity = 0.95;
const camera = new THREE.PerspectiveCamera(30, 4 / 3, 0.1, 100);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.minDistance = 1.5; controls.maxDistance = 18;
const key = new THREE.DirectionalLight(0xffffff, 2.5);
key.position.set(-4.4, 6.4, 6.3); key.castShadow = true; key.shadow.mapSize.set(2048, 2048); key.shadow.radius = 5; key.shadow.bias = -0.0004;
Object.assign(key.shadow.camera, { left: -4, right: 4, top: 4.5, bottom: -1.5, near: 1, far: 24 });
scene.add(key);
const rim = new THREE.DirectionalLight(0xffffff, 0.8); rim.position.set(-4, 5, -5); scene.add(rim);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.ShadowMaterial({ opacity: 0.2 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
function resize() { const r = host.getBoundingClientRect(); renderer.setSize(r.width, r.height, false); camera.aspect = r.width / r.height; camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(host);

// ---------- 道具
const propFactory = {};
function makeProp(id) {
  if (!propFactory[id]) {
    const g = buildModel({ materials: BE.MATERIALS, parts: BE.PROPS[id].parts });
    g.traverse((o) => { if (o.isMesh) o.castShadow = true; });
    propFactory[id] = g;
  }
  const c = propFactory[id].clone(); c.name = 'prop:' + id; return c;
}

// ---------- 六隻角色（第一次選到時才建）
const chars = {};
function getChar(who) {
  if (chars[who]) return chars[who];
  const ch = BE.CHARACTERS[who], model = buildModel(ch);
  model.visible = false; scene.add(model);
  const acts = BA[who];
  const moves = acts.moves.map((m) => (m.use ? { ...KB.ACTIONS.find((a) => a.id === m.use), id: m.use, name: m.name, desc: m.desc, group: '招式' } : m));
  const basics = acts.basics || KB.ACTIONS.filter((a) => HERO_BASIC[a.id]).map((a) => ({ ...a, name: HERO_BASIC[a.id] }));
  const all = [...moves, ...basics];
  const mixer = new THREE.AnimationMixer(model), clips = buildClips(all, model);
  const props = [];
  for (const [socket, pid] of Object.entries(ch.hold || {})) {
    const s = model.getObjectByName(socket), p = makeProp(pid); s.add(p);
    props.push({ socket: s, spec: BE.PROPS[pid], trail: null, last: null });
  }
  chars[who] = { ch, model, mixer, clips, moves, basics, all, props, current: null,
    tail: Array.from({ length: BE.TAIL_JOINTS }, (_, i) => model.getObjectByName('tail' + i)).filter(Boolean),
    flame: model.getObjectByName('tailFlame'), node: (n) => model.getObjectByName(n) };
  return chars[who];
}
let who = 'bear1', act = null;
const C = () => chars[who];
const A = () => C().all.find((a) => a.id === act);

function play(id) {
  const c = C(); act = id;
  const next = c.mixer.clipAction(c.clips[id]);
  if (c.current !== next) { if (c.current) c.current.fadeOut(0.25); next.reset().setEffectiveWeight(1).fadeIn(0.25).play(); c.current = next; }
  const a = A();
  document.getElementById('now').textContent = a.name;
  document.getElementById('desc').textContent = a.desc;
  document.querySelectorAll('#g-moves button, #g-basic button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.id === id));
  prevU = null;
}
function buttons(box, list) {
  box.replaceChildren(...list.map((a) => { const b = document.createElement('button'); b.type = 'button'; b.id = 'act-' + a.id; b.dataset.id = a.id; b.textContent = a.name; b.onclick = () => play(a.id); return b; }));
}
function setWho(w) {
  who = w;
  const c = getChar(w), ch = c.ch;
  for (const k in chars) chars[k].model.visible = k === w;
  document.querySelectorAll('.fam button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.who === w));
  document.getElementById('wrap').style.setProperty('--tone', ch.family === 'bear' ? 'var(--bear)' : 'var(--cat)');
  const [img, x] = REF[w];
  const ref = document.getElementById('refImg');
  ref.style.backgroundImage = `url(ref/${img}.webp)`; ref.style.backgroundPosition = `${x} 12%`;
  document.getElementById('refCap').textContent = '原畫：' + ch.name;
  document.getElementById('cardName').innerHTML = `${ch.name} <span>${ch.family === 'bear' ? '火熊' : '貓娘'} · ${ch.stage} 階</span>`;
  const [atk, ult] = c.moves;
  document.getElementById('cardStats').innerHTML = [['骨架', ch.rig === 'quad' ? '四足骨架（自訂步態）' : '主角骨架（可套用主角動作）'], ['普攻', atk.name.replace(/（.*）/, '')], ['大絕', ult.name.replace(/（.*）/, '')], ['手持', ch.hold ? Object.values(ch.hold).map((p) => BE.PROPS[p].name).filter((v, i, a) => a.indexOf(v) === i).join('、') : (w === 'bear3' ? '背上大劍（大絕時拔出）' : '—')]]
    .map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('');
  buttons(document.getElementById('g-moves'), c.moves);
  buttons(document.getElementById('g-basic'), c.basics);
  c.current = null; c.mixer.stopAllAction(); if (c.armorUntil) setGlow(c, 0); c.armorUntil = 0; document.getElementById('buff').hidden = true;
  play(c.moves[0].id);
  const h = ch.height;
  camera.position.set(h * 0.9 + 1.2, h * 0.75 + 0.3, h * 2.3 + 3.2); controls.target.set(0, h * 0.48, 0); controls.update();
  try { localStorage.setItem('beasts-who', w); } catch (e) {}
}
document.querySelectorAll('.fam button').forEach((b) => { b.onclick = () => setWho(b.dataset.who); });

// ---------- 特效
const puffTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.5, 'rgba(255,255,255,0.5)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
})();
const puffs = [], rings = [], decals = [], emitters = [];
let shake = 0;
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const rnd = (a = 1) => (Math.random() - 0.5) * a;
const FIRE = ['#FFD35A', '#FF9A2A', '#F2541E', '#E5341C'];
function puff(p, v, color, size0, size1, life, opacity, additive = false) {
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: puffTex, color, transparent: true, depthWrite: false, opacity, blending: additive ? THREE.AdditiveBlending : THREE.NormalBlending }));
  sp.position.copy(p); sp.scale.setScalar(size0); scene.add(sp);
  puffs.push({ sp, v, size0, size1, life, age: 0, opacity });
}
const firePuff = (p, v, s0, s1, life) => puff(p, v, FIRE[(Math.random() * FIRE.length) | 0], s0, s1, life, 0.85, false);   // 一般混色：淺色背景上也看得清楚
function shockwave(p, r = 1, color = '#8C7A66') {
  for (const [delay, c] of [[0, color], [0.12, '#B8A68E']]) {
    const m = new THREE.Mesh(new THREE.RingGeometry(0.8, 1, 64), new THREE.MeshBasicMaterial({ color: c, transparent: true, opacity: 0, side: THREE.DoubleSide, depthWrite: false }));
    m.rotation.x = -Math.PI / 2; m.position.set(p.x, 0.006, p.z); scene.add(m); rings.push({ m, age: -delay, r });
  }
  for (let i = 0; i < 14; i++) { const a = (i / 14) * Math.PI * 2, s = (0.9 + Math.random() * 0.8) * r; puff(V(p.x, 0.05, p.z), V(Math.cos(a) * s, 0.5 + Math.random() * 0.6, Math.sin(a) * s), '#A89580', 0.12 * r, 0.5 * r, 0.9 + Math.random() * 0.4, 0.75); }
}
// 弧形刀光／爪痕：平面朝角色正前方，tilt = 斜度
function arc(p, fwdDir, radius, width, color, tilt, life = 0.35, start = -0.9, len = 1.8) {
  const m = new THREE.Mesh(new THREE.RingGeometry(radius - width, radius, 40, 1, start, len), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.95, side: THREE.DoubleSide, depthWrite: false, blending: THREE.AdditiveBlending }));
  m.position.copy(p); m.lookAt(p.clone().add(fwdDir)); m.rotateZ(tilt); scene.add(m);
  decals.push({ m, age: 0, life, grow: 0.35 });
}
// 水平刀光：一道平躺在胸口高度、繞角色前方的弧（yaw = 角色朝向）
function flatArc(center, yaw, R, width, color, life = 0.35, len = 2.6, tilt = 0.12) {
  const g = new THREE.Group(); g.position.copy(center); g.rotation.set(tilt, yaw, 0, 'YXZ');
  const m = new THREE.Mesh(new THREE.RingGeometry(R - width, R, 48, 1, -Math.PI / 2 - len / 2, len), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.95, side: THREE.DoubleSide, depthWrite: false }));
  m.rotation.x = -Math.PI / 2; g.add(m); scene.add(g);
  decals.push({ m: g, age: 0, life, grow: 0.25, mats: [m.material] });
}
// 直線刀痕：大半徑的短弧（接近直線），中心通過 p；angle = 在正面平面上的傾斜角（± 45° 疊成 X）
function stroke(p, fwdDir, R, width, len, color, angle, life = 0.4) {
  const geo = new THREE.RingGeometry(R - width, R, 24, 1, -len / 2, len); geo.translate(-R + width / 2, 0, 0);
  const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.95, side: THREE.DoubleSide, depthWrite: false }));
  m.position.copy(p); m.lookAt(p.clone().add(fwdDir)); m.rotateZ(angle); scene.add(m);
  decals.push({ m, age: 0, life, grow: 0.15, mats: [m.material] });
}
// 肉球印：一顆大肉墊＋四顆小趾頭
function pawPrint(p, normal, size, color, life = 0.6, flat = false) {
  const g = new THREE.Group(), mat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.95, side: THREE.DoubleSide, depthWrite: false });
  const pad = new THREE.Mesh(new THREE.CircleGeometry(0.42, 28), mat); pad.scale.set(1.2, 0.95, 1); pad.position.y = -0.18; g.add(pad);
  [[-0.5, 0.28], [-0.18, 0.5], [0.18, 0.5], [0.5, 0.28]].forEach(([x, y]) => { const t = new THREE.Mesh(new THREE.CircleGeometry(0.17, 20), mat); t.position.set(x, y, 0); g.add(t); });
  g.position.copy(p);
  if (flat) g.rotation.x = -Math.PI / 2; else g.lookAt(p.clone().add(normal));
  g.scale.setScalar(size * 0.3); scene.add(g);
  decals.push({ m: g, age: 0, life, grow: 1.1, size, mats: [mat] });
}
function pillar(p, delay, h = 1, life = 0.9) { emitters.push({ kind: 'pillar', p: p.clone(), age: -delay, life, h }); }

const tA = new THREE.Vector3(), tB = new THREE.Vector3(), fwd = new THREE.Vector3(), qTmp = new THREE.Quaternion();
const fwdOf = (obj) => V(0, 0, 1).applyQuaternion(obj.getWorldQuaternion(qTmp)).normalize();
const worldOf = (obj, local = [0, 0, 0]) => obj.localToWorld(V(...local));
