<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>擂台特效檢查</title>
<style>html,body{margin:0;background:#3b4a5a}canvas{display:block}#info{position:fixed;left:8px;top:6px;color:#fff;font:13px system-ui}</style></head>
<body><div id="info"></div>
<script src="../../vendor/three.min.js"></script><script src="../../vendor/GLTFLoader.js"></script><script src="../../js/arena-fx.js"></script>
<script>
// 以固定時間步長模擬 game.js 的 strike()：播放攻擊者 GLB 動作、依 SpiritVfx.script 觸發特效、近戰衝刺。
// 用法：await __fx.setup('water-dog-3'); __fx.run(true, 3.0) → 推進到第 3.0 秒並繪圖。
const T=THREE,renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(innerWidth,innerHeight);document.body.append(renderer.domElement);
const scene=new T.Scene();scene.background=new T.Color(0x536a79);
scene.add(new T.HemisphereLight(0xffffff,0x8899aa,1.1));const sun=new T.DirectionalLight(0xffffff,1.1);sun.position.set(4,9,6);scene.add(sun);
const floor=new T.Mesh(new T.PlaneGeometry(40,40),new T.MeshStandardMaterial({color:0x5aa646}));floor.rotation.x=-Math.PI/2;scene.add(floor);
const group=new T.Group();scene.add(group);
const cam=new T.PerspectiveCamera(36,innerWidth/innerHeight,.1,100);cam.position.set(0,9.9,18);cam.lookAt(0,-.2,0);
const loader=new T.GLTFLoader();let effects=[],elapsed=0,A,D,script,mixerClips;
async function actor(path,height,x,z,ry){const g=await new Promise((r,j)=>loader.load(path,r,undefined,j));const root=new T.Group(),object=g.scene;root.add(object);object.updateMatrixWorld(true);
 const box=new T.Box3().setFromObject(object),size=box.getSize(new T.Vector3()),k=height/size.y;object.scale.multiplyScalar(k);object.position.y-=box.min.y*k;
 const mixer=new T.AnimationMixer(object),actions={};g.animations.forEach(c=>actions[c.name]=mixer.clipAction(c));
 root.position.set(x,0,z);root.rotation.y=ry;scene.add(root);return{root,object,mixer,actions,path,worldSize:new T.Vector3(size.x*k,height,size.z*k),height};}
window.__fx={
 async setup(model,height=2.1,defender='water-caterpillar',dh=1.3){
  scene.remove(...scene.children.filter(c=>c.userData.actor));if(A)scene.remove(A.root);if(D)scene.remove(D.root);
  A=await actor('../../models/spirits/'+model+'.glb',height,0,5.5,Math.PI);D=await actor('../../models/spirits/'+defender+'.glb',dh,0,-5.5,0);window.__A=A;return Object.keys(A.actions).join(',');
 },
 // 重新從 0 秒開始並推進到 sec（每格 1/30 秒）
 run(strong,sec,color){
  group.clear();effects=[];elapsed=0;A.mixer.stopAllAction();A.root.position.set(0,0,5.5);
  const mode=strong?'Ultimate':'Attack',clip=A.actions[mode];if(clip){clip.reset().setLoop(T.LoopOnce,1);clip.clampWhenFinished=true;clip.play();}
  const orb=SpiritVfx.keyOf(A.path)==='orb',dur=orb?(strong?1.15:.55):clip.getClip().duration;const base=A.object.scale.clone();
  script=SpiritVfx.script({T,path:A.path,strong,attacker:A,defender:D,group,now:()=>elapsed,add:(d,fn,done)=>effects.push({start:elapsed,duration:d,update:t=>fn(t,t*d),done}),sound:()=>{},color:color||0x8ac4ff,element:'water'});
  const p=new T.Vector3(0,0,5.5),dir=new T.Vector3(0,0,-1),gap=Math.max(1.2,Math.min(3.2,.3*A.worldSize.y+.35*D.worldSize.y+.6));
  const dt=1/30;for(let t=0;t<sec;t+=dt){elapsed+=dt;A.mixer.update(dt);const ts=Math.min(t,dur);script.update(ts);
   const ap=Math.max(0,p.distanceTo(D.root.position)-gap)*script.approach(ts);A.root.position.copy(p).addScaledVector(dir,ap);const ps=script.pose?.(ts);A.root.position.y=ps?ps.y:0;if(ps)A.object.scale.set(base.x*(1+ps.sq),base.y*(1-ps.sq),base.z*(1+ps.sq));else A.object.scale.copy(base);
   for(let i=effects.length-1;i>=0;i--){const e=effects[i],u=Math.min(1,(elapsed-e.start)/e.duration);e.update(u);if(u>=1){e.done?.();effects.splice(i,1);}}}
  renderer.render(scene,cam);document.getElementById('info').textContent=A.path.split('/').pop()+' '+mode+' t='+sec.toFixed(2)+'/'+dur.toFixed(2)+'  effects='+effects.length+' group='+group.children.length;
  return{dur,effects:effects.length,children:group.children.length};
 },
 view(x,y,z,tx,ty,tz){cam.position.set(x,y,z);cam.lookAt(tx,ty,tz);}
};
</script></body></html>
