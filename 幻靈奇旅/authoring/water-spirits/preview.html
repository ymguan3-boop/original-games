<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>水系幻靈六隻</title>
<style>
  :root { --bg: #EFE6DC; --panel: #FFFFFF; --ink: #3B2A22; --muted: #85705F; --line: #E2D5C7; --accent: #2E7CC4; --accent-ink: #FFFFFF; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #1B1F24; --panel: #262B31; --ink: #ECE6DE; --muted: #A79C90; --line: #39414A; --accent: #5FA8EA; --accent-ink: #0E1620; } }
  :root[data-theme="dark"] { --bg: #1B1F24; --panel: #262B31; --ink: #ECE6DE; --muted: #A79C90; --line: #39414A; --accent: #5FA8EA; --accent-ink: #0E1620; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 system-ui, "Microsoft JhengHei", sans-serif; }
  header { padding: 18px 16px 8px; max-width: 1280px; margin: 0 auto; }
  h1 { margin: 0 0 4px; font-size: 24px; }
  header p { margin: 0; color: var(--muted); }
  main { max-width: 1280px; margin: 0 auto; padding: 8px 16px 32px; display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; }
  @media (max-width: 900px) { main { grid-template-columns: minmax(0, 1fr); } }
  .stage { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; aspect-ratio: 16 / 10; }
  .stage canvas { display: block; width: 100%; height: 100%; }
  .labels { position: absolute; inset: 0; pointer-events: none; }
  .tag { position: absolute; transform: translate(-50%, 0); background: rgba(59, 42, 34, .78); color: #fff; padding: 2px 9px; border-radius: 99px; font-size: 13px; white-space: nowrap; }
  .tag small { opacity: .75; margin-left: 4px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 12px 0 0; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--panel); }
  .seg button { border: 0; background: none; color: var(--ink); padding: 8px 14px; font: inherit; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .opt { color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
  aside { display: flex; flex-direction: column; gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
  .card h2 { margin: 0 0 8px; font-size: 16px; }
  .list { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .list button { text-align: left; border: 1px solid var(--line); background: none; color: var(--ink); border-radius: 10px; padding: 6px 10px; font: inherit; cursor: pointer; }
  .list button[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .list small { color: var(--muted); display: block; font-size: 12px; }
  .ref img { width: 100%; border-radius: 10px; display: block; }
  .ref p { margin: 8px 0 0; color: var(--muted); font-size: 13px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td, th { text-align: left; padding: 4px 2px; border-top: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; white-space: nowrap; }
</style>
</head>
<body>
<header>
  <h1>水系幻靈六隻</h1>
  <p>Three.js 關節模型，每隻腳下一灘水；可同時播放待機、移動、攻擊與大絕招。點右側名稱可拉近單看。</p>
</header>
<main>
  <section>
    <div class="stage" id="stage"><div class="labels" id="labels"></div></div>
    <div class="bar">
      <div class="seg" id="modes" role="group" aria-label="動作"></div>
      <label class="opt"><input type="range" id="speed" min="0.25" max="1.5" step="0.25" value="1"> 速度 <output id="speedOut">1×</output></label>
      <label class="opt"><input type="checkbox" id="spin"> 自動旋轉</label>
    </div>
  </section>
  <aside>
    <div class="card"><h2>幻靈</h2><div class="list" id="list"></div></div>
    <div class="card ref"><h2 id="refTitle">原畫</h2><img id="refImg" alt=""><p id="refNote"></p></div>
    <div class="card"><h2>動作說明</h2><table id="info"></table></div>
  </aside>
</main>
<script src="spirits.js"></script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { buildBird as buildModel } from './builder.js';
const { SPIRITS, MATERIALS } = window.WATER_SPIRITS;
const MODES = [['idle', '待機'], ['move', '移動'], ['attack', '攻擊'], ['ultimate', '大絕招']];

// ---------- 場景
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.9;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color('#E9DED2');
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.5;
const camera = new THREE.PerspectiveCamera(36, 1.6, 0.1, 200);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.49;
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(-6, 12, 9);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -12, right: 12, top: 10, bottom: -10, near: 1, far: 40 });
sun.shadow.radius = 4;
scene.add(sun, new THREE.HemisphereLight(0xfff6ea, 0xc9b8a4, 0.9));
const floor = new THREE.Mesh(new THREE.CircleGeometry(30, 64), new THREE.MeshStandardMaterial({ color: '#E3D5C5', roughness: 1 }));
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

// ---------- 水灘：不規則形狀的淺水面＋淡淡的邊緣，定時泛起漣漪
const waterMat = new THREE.MeshPhysicalMaterial({ color: '#7CC9F2', roughness: 0.04, metalness: 0, clearcoat: 1, transparent: true, opacity: 0.62, depthWrite: false });
const rimMat = new THREE.MeshStandardMaterial({ color: '#B9DFF2', roughness: 0.6, transparent: true, opacity: 0.45, depthWrite: false });
function puddleShape(r, seed) {
  const shape = new THREE.Shape(), n = 48;
  for (let i = 0; i <= n; i++) {
    const a = (i / n) * Math.PI * 2;
    const k = 1 + 0.09 * Math.sin(a * 3 + seed) + 0.06 * Math.sin(a * 5 + seed * 2.3) + 0.04 * Math.sin(a * 7 + seed * 0.7);
    const x = Math.cos(a) * r * k * 1.15, y = Math.sin(a) * r * k * 0.9;
    i ? shape.lineTo(x, y) : shape.moveTo(x, y);
  }
  return shape;
}
function makePuddle(r, seed) {
  const g = new THREE.Group();
  const rim = new THREE.Mesh(new THREE.ShapeGeometry(puddleShape(r * 1.06, seed), 1), rimMat);
  const water = new THREE.Mesh(new THREE.ShapeGeometry(puddleShape(r, seed), 1), waterMat);
  rim.rotation.x = water.rotation.x = -Math.PI / 2;
  rim.position.y = 0.004; water.position.y = 0.008;
  water.receiveShadow = true;
  g.add(rim, water);
  return g;
}

// ---------- 六隻幻靈：排成兩排，每隻有自己的水灘
const spirits = SPIRITS.map((sp, i) => {
  const holder = new THREE.Group();
  // 前排三隻金魚、後排水毛蟲／水蛟龍王（中間，體型最大）／水仙子
  const SPOT = { goldfish: [-4.6, 2.8], king: [0, 2.8], queen: [4.6, 2.8], caterpillar: [-5.4, -2.4], dragon: [0, -3.4], fairy: [5.4, -2.4] };
  holder.position.set(SPOT[sp.id][0], 0, SPOT[sp.id][1]);
  holder.rotation.y = 0.35;
  const model = buildModel({ id: sp.id, materials: MATERIALS, parts: sp.parts });
  if (sp.scale) model.scale.setScalar(sp.scale);
  model.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  holder.add(makePuddle(sp.puddle, i * 1.7 + 0.5), model);
  scene.add(holder);
  // 有名字的關節：記住靜止姿勢，每格把動作的增量疊上去
  const nodes = {};
  model.traverse((o) => { if (o.name && o !== model) nodes[o.name] = { o, r0: o.rotation.clone(), p0: o.position.clone(), s0: o.scale.clone() }; });
  const tag = document.createElement('div');
  tag.className = 'tag';
  tag.innerHTML = `${sp.name}<small>${sp.stage}</small>`;
  document.getElementById('labels').append(tag);
  return { sp, holder, model, nodes, tag, t: 0, fired: new Set(), nextRipple: Math.random() * 1.5 };
});

// ---------- 特效庫
const fx = [];
const tmp = new THREE.Vector3();
const local = (s, x, y, z) => s.holder.localToWorld(new THREE.Vector3(x, y, z));
const forward = (s) => new THREE.Vector3(0, 0, 1).applyQuaternion(s.holder.quaternion);
// 關節上的點（模型靜止座標 P）→ 世界座標；用來讓特效從嘴巴等會動的部位發出
const nodePoint = (s, name, P) => { const j = s.nodes[name]; return j.o.localToWorld(new THREE.Vector3(P[0] - j.p0.x, P[1] - j.p0.y, P[2] - j.p0.z)); };
const nodeDir = (s, name, P, flat) => { const d = nodePoint(s, name, [P[0], P[1], P[2] + 1]).sub(nodePoint(s, name, P)); if (flat) d.y = 0; return d.normalize(); };   // flat：只取水平方向
const mat = (color, opacity = 0.8, add = false) => new THREE.MeshPhysicalMaterial({ color, roughness: 0.05, clearcoat: 1, transparent: true, opacity, depthWrite: false, blending: add ? THREE.AdditiveBlending : THREE.NormalBlending });
const sphere = new THREE.SphereGeometry(1, 16, 12);
function addFx(obj, life, update) { scene.add(obj); fx.push({ obj, age: 0, life, update }); }
function ripple(pos, maxR = 1.5, color = 0xffffff) {
  const m = new THREE.Mesh(new THREE.RingGeometry(0.85, 1, 48), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.7, depthWrite: false, side: THREE.DoubleSide }));
  m.rotation.x = -Math.PI / 2; m.position.set(pos.x, 0.02, pos.z);
  addFx(m, 1.2, (k) => { m.scale.setScalar(0.15 + maxR * k); m.material.opacity = 0.7 * (1 - k); });
}
function splash(pos, n = 20, color = 0x8fd6ff) {
  for (let i = 0; i < n; i++) {
    const d = new THREE.Mesh(sphere, mat(color, 0.85)); d.scale.setScalar(0.04 + Math.random() * 0.05); d.position.copy(pos);
    const a = Math.random() * Math.PI * 2, sp = 1 + Math.random() * 2.5, v = new THREE.Vector3(Math.cos(a) * sp, 2.5 + Math.random() * 3, Math.sin(a) * sp);
    addFx(d, 1.1, (k, dt) => { v.y -= 9.8 * dt; d.position.addScaledVector(v, dt); if (d.position.y < 0.02) { d.position.y = 0.02; v.set(0, 0, 0); } d.material.opacity = 0.85 * (1 - k * k); });
  }
}
function bullet(s, o = {}) {
  const from = o.node ? nodePoint(s, o.node, o.at) : local(s, o.x || 0, o.y || 1, o.z || 0.6), dir = o.node ? nodeDir(s, o.node, o.at, o.flat) : forward(s);
  const big = !!o.big, b = new THREE.Group();
  const core = new THREE.Mesh(sphere, mat(0xbfe9ff, 0.95)); core.scale.setScalar(big ? 0.22 : 0.13);
  const shell = new THREE.Mesh(sphere, mat(0x5fb8f0, 0.45)); shell.scale.set(big ? 0.3 : 0.18, big ? 0.3 : 0.18, big ? 0.5 : 0.3);
  b.add(core, shell); b.position.copy(from); b.lookAt(from.clone().add(dir));
  let done = false;
  addFx(b, 0.75, (k, dt) => {
    b.position.addScaledVector(dir, (big ? 7 : 6) * dt); b.position.y -= 0.8 * dt * k;
    if (k > 0.95 && !done) { done = true; splash(b.position.clone(), big ? 22 : 12); ripple(new THREE.Vector3(b.position.x, 0, b.position.z), big ? 1.6 : 1); }
  });
  // 尾巴的小水珠
  for (let i = 0; i < 6; i++) setTimeout(() => { const d = new THREE.Mesh(sphere, mat(0x9fdcff, 0.6)); d.scale.setScalar(0.05); d.position.copy(b.position); addFx(d, 0.4, (k) => { d.scale.setScalar(0.05 * (1 - k)); }); }, i * 80);
}
function geyser(pos, h = 4, color = 0x7fd2ff) {
  const col = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.42, 1, 24, 1, true), mat(color, 0.55));
  col.position.copy(pos);
  addFx(col, 1.6, (k) => { const up = Math.min(1, k * 3), fall = k > 0.6 ? (k - 0.6) / 0.4 : 0; col.scale.set(1 - fall * 0.6, h * up * (1 - fall * 0.7), 1 - fall * 0.6); col.position.y = (h * up * (1 - fall * 0.7)) / 2; col.material.opacity = 0.55 * (1 - fall); });
  setTimeout(() => splash(pos.clone().setY(h * 0.8), 36, color), 450);
}
function vortex(pos, o) {
  const g = new THREE.Group(); g.position.copy(pos);
  const n = 70, drops = [];
  for (let i = 0; i < n; i++) { const d = new THREE.Mesh(sphere, mat(o.color, 0.75, o.color !== 0x7fd2ff && o.color !== 0x4fa8ff)); d.scale.setScalar(0.05 + Math.random() * 0.05); g.add(d); drops.push({ d, a: Math.random() * 6.28, y: Math.random(), w: 3 + Math.random() * 3 }); }
  const funnel = new THREE.Mesh(new THREE.CylinderGeometry(o.r, o.r * 0.35, o.h, 32, 1, true), mat(o.color, 0.18)); funnel.position.y = o.h / 2; g.add(funnel);
  addFx(g, o.dur, (k, dt) => {
    const grow = Math.min(1, k * 4) * (k > 0.85 ? (1 - k) / 0.15 : 1);
    for (const p of drops) { p.a += p.w * dt; p.y = (p.y + dt * 0.5) % 1; const r = (o.r * (0.35 + 0.65 * p.y)) * grow; p.d.position.set(Math.cos(p.a) * r, p.y * o.h * grow, Math.sin(p.a) * r); }
    funnel.rotation.y += dt * 4; funnel.scale.set(grow, grow, grow); funnel.position.y = (o.h * grow) / 2; funnel.material.opacity = 0.18 * grow;
  });
}
function beam(s, o) {
  const g = new THREE.Group();
  const outer = new THREE.Mesh(new THREE.CylinderGeometry(o.r, o.r * 0.7, 1, 24, 1, true), mat(o.color, 0.42));
  const inner = new THREE.Mesh(new THREE.CylinderGeometry(o.r * 0.42, o.r * 0.3, 1, 16, 1, true), mat(0xe8f8ff, 0.55));
  g.add(outer, inner);
  const from = o.node ? nodePoint(s, o.node, o.at) : local(s, 0, o.y || 1.5, o.z || 0);
  const dir = o.up ? new THREE.Vector3(0, 1, 0) : o.node ? nodeDir(s, o.node, o.at, o.flat) : forward(s);
  g.position.copy(from); g.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
  const swirl = [];
  if (o.swirl) {
    const p1 = new THREE.Vector3(1, 0, 0).cross(dir).normalize(), p2 = dir.clone().cross(p1).normalize();
    for (let i = 0; i < 48; i++) { const d = new THREE.Mesh(sphere, mat(i % 3 ? 0x9fdcff : 0xffffff, 0.85)); d.scale.setScalar(0.07 + Math.random() * 0.07); scene.add(d); swirl.push({ d, a: Math.random() * 6.28, u: Math.random(), p1, p2 }); }
  }
  addFx(g, o.dur, (k, dt) => {
    const len = o.len * Math.min(1, k * 5), fade = k > 0.8 ? (1 - k) / 0.2 : 1;
    for (const w of swirl) {
      w.a += 7 * dt; w.u = (w.u + 0.9 * dt) % 1;
      const rr = o.r * (1.35 + 0.25 * Math.sin(w.a * 2));
      w.d.position.copy(from).addScaledVector(dir, w.u * len).addScaledVector(w.p1, Math.cos(w.a) * rr).addScaledVector(w.p2, Math.sin(w.a) * rr);
      w.d.material.opacity = 0.85 * fade; if (k >= 0.99) { scene.remove(w.d); w.d.material.dispose(); }
    }
    [outer, inner].forEach((m) => { m.scale.set(fade * (1 + 0.15 * Math.sin(k * 60)), len, fade * (1 + 0.15 * Math.sin(k * 60))); m.position.y = len / 2; });
    outer.material.opacity = 0.42 * fade; inner.material.opacity = 0.55 * fade;
    if (!o.up && Math.random() < 0.3) splash(from.clone().addScaledVector(dir, len), 2, o.color);
  });
}
function pearls(s, n) {
  const c = local(s, 0, 1.4, 0);
  for (let i = 0; i < n; i++) {
    const p = new THREE.Mesh(sphere, new THREE.MeshPhysicalMaterial({ color: 0xfbf6ee, roughness: 0.1, clearcoat: 1, sheen: 1, iridescence: 1, transparent: true }));
    p.scale.setScalar(0.1 + Math.random() * 0.08); p.position.copy(c);
    const a = (i / n) * Math.PI * 2, v = new THREE.Vector3(Math.cos(a) * 2.2, 1 + Math.random() * 1.5, Math.sin(a) * 2.2);
    addFx(p, 1.4, (k, dt) => { v.y -= 2.5 * dt; p.position.addScaledVector(v, dt); p.material.opacity = 1 - k * k; if (k > 0.97) splash(p.position.clone(), 3, 0xf5efe6); });
  }
}
function bubbles(s, n) {
  for (let i = 0; i < n; i++) {
    const b = new THREE.Mesh(sphere, mat(0xd6f0ff, 0.45)); const r = 0.05 + Math.random() * 0.1; b.scale.setScalar(r);
    const a = Math.random() * Math.PI * 2, d = 0.4 + Math.random() * 1.2; b.position.copy(local(s, Math.cos(a) * d, 0.2, Math.sin(a) * d));
    const v = 0.8 + Math.random() * 1.4;
    addFx(b, 2, (k, dt) => { b.position.y += v * dt; b.position.x += Math.sin(k * 12 + i) * 0.01; b.material.opacity = 0.45 * (1 - k); });
  }
}
function trail(s) { const p = local(s, 0, 0, -0.3); ripple(new THREE.Vector3(p.x, 0, p.z), 0.8); }
function sparkle(s) {
  for (let i = 0; i < 8; i++) { const d = new THREE.Mesh(sphere, mat(0xcfefff, 0.9, true)); d.scale.setScalar(0.03); d.position.copy(local(s, (Math.random() - 0.5) * 0.8, 1 + Math.random() * 0.6, -0.3)); addFx(d, 0.8, (k, dt) => { d.position.y -= 0.6 * dt; d.material.opacity = 0.9 * (1 - k); }); }
}
function orb(s, o) {
  const node = s.nodes.forearmR?.o;
  const b = new THREE.Mesh(sphere, mat(0x8fd6ff, 0.8, true));
  addFx(b, o.dur, (k) => { if (node) node.localToWorld(b.position.set(-0.47, 1.04, 0.07)); b.scale.setScalar(0.05 + 0.12 * k); });
}
function lotus(s, o) {
  const g = new THREE.Group(); g.position.copy(local(s, 0, 0.05, 0));
  const petals = [];
  for (let ring = 0; ring < 2; ring++) for (let i = 0; i < 8; i++) {
    const p = new THREE.Mesh(sphere, mat(ring ? 0xd8f3ff : 0x7fd2ff, 0.55)); p.scale.set(0.35, 0.05, 0.8 - ring * 0.2);
    const piv = new THREE.Group(); piv.rotation.y = (i / 8) * Math.PI * 2 + ring * 0.2; piv.add(p); p.position.z = 0.8 - ring * 0.25; g.add(piv); petals.push({ p, piv, ring });
  }
  addFx(g, o.dur, (k) => { const open = Math.min(1, k * 3), fade = k > 0.8 ? (1 - k) / 0.2 : 1; for (const q of petals) { q.p.rotation.x = -(1.2 - open) * (q.ring ? 1.3 : 0.9); q.p.material.opacity = 0.55 * fade; } g.scale.setScalar(0.6 + open * 1.2); g.rotation.y = k * 2; });
}
function rain(s, o) {
  const c = local(s, 0, 0, 0); let t = 0;
  addFx(new THREE.Group(), o.dur, (k, dt) => {
    t += dt; if (t < 0.04) return; t = 0;
    const d = new THREE.Mesh(sphere, mat(0x9fdcff, 0.8)); d.scale.set(0.035, 0.12, 0.035);
    const a = Math.random() * Math.PI * 2, r = Math.random() * 2.2; d.position.set(c.x + Math.cos(a) * r, 4.5, c.z + Math.sin(a) * r);
    addFx(d, 0.9, (kk, ddt) => { d.position.y -= 6 * ddt; if (d.position.y < 0.05 && !d.userData.hit) { d.userData.hit = 1; ripple(d.position.clone().setY(0), 0.4); d.visible = false; } });
  });
}
function wave(s, o) {
  const c = local(s, 0, 0, 0);
  const m = new THREE.Mesh(new THREE.TorusGeometry(1, 0.12, 12, 64), mat(0x6fc4ff, 0.6));
  m.rotation.x = -Math.PI / 2; m.position.set(c.x, 0.1, c.z);
  addFx(m, 1.3, (k) => { m.scale.set(0.3 + o.r * k, 0.3 + o.r * k, 1 + 2 * Math.sin(k * Math.PI)); m.material.opacity = 0.6 * (1 - k); });
}
function silk(s, o) {
  const from = nodePoint(s, o.node, o.at), dir = nodeDir(s, o.node, o.at, o.flat);
  const side = new THREE.Vector3(0, 1, 0).cross(dir).normalize(), up = dir.clone().cross(side).normalize();
  const center = from.clone().addScaledVector(dir, 3.4); center.y = Math.max(center.y, 0.9);
  const silkMat = () => new THREE.MeshBasicMaterial({ color: 0xf4fbff, transparent: true, opacity: 0.9, depthWrite: false });
  const strands = [];
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * Math.PI * 2, tgt = center.clone().addScaledVector(side, Math.cos(a) * 0.9).addScaledVector(up, Math.sin(a) * 0.7);
    const m = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.04, 1, 8), silkMat()); m.position.copy(from);
    m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), tgt.clone().sub(from).normalize()); strands.push({ m, len: tgt.distanceTo(from), dir: tgt.clone().sub(from).normalize() });
    addFx(m, o.web ? 2.2 : 1.1, (k) => { const L = strands[i].len * Math.min(1, k * 4); m.scale.set(1, L, 1); m.position.copy(from).addScaledVector(strands[i].dir, L / 2); m.material.opacity = 0.9 * (k > 0.7 ? (1 - k) / 0.3 : 1); });
  }
  if (!o.web) return;
  const web = new THREE.Group(); web.position.copy(center); web.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), dir.clone().negate());
  for (let i = 0; i < 8; i++) { const sp = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 1.3, 6), silkMat()); sp.rotation.z = (i / 8) * Math.PI; web.add(sp); }
  [0.25, 0.45, 0.65].forEach((r) => web.add(new THREE.Mesh(new THREE.TorusGeometry(r, 0.016, 5, 8), silkMat())));
  setTimeout(() => addFx(web, 1.8, (k) => { web.scale.setScalar(0.3 + 0.9 * Math.min(1, k * 3)); web.traverse((c) => { if (c.material) c.material.opacity = 0.9 * (k > 0.7 ? (1 - k) / 0.3 : 1); }); }), 250);
}
const FX = {
  silk,
  trail, sparkle, bullet, orb, lotus, rain, wave, pearls: (s, o) => pearls(s, o.n), bubbles: (s, o) => bubbles(s, o.n),
  ripple: (s, o) => ripple(local(s, 0, 0, 0).setY(0), o.r), splash: (s, o) => splash(local(s, 0, 0.6, o.z || 0), o.n, o.color),
  geyser: (s, o) => geyser(local(s, 0, 0, 0), o.h, o.color), vortex: (s, o) => vortex(local(s, 0, 0, 0), o), beam,
};

// ---------- 動作播放
let mode = 'idle', focus = null;
function setMode(m) {
  mode = m;
  spirits.forEach((s) => { s.t = 0; s.fired.clear(); });
  refresh();
}
function poseSpirit(s, dt) {
  const act = s.sp.actions[mode];
  s.t += dt;
  if (s.t >= act.dur) { s.t -= act.dur; s.fired.clear(); }
  const n = {};
  for (const k of Object.keys(s.nodes)) n[k] = { r: [0, 0, 0], p: [0, 0, 0], s: [1, 1, 1] };
  act.pose(n, s.t);
  for (const [k, v] of Object.entries(s.nodes)) {
    const d = n[k];
    v.o.rotation.set(v.r0.x + d.r[0], v.r0.y + d.r[1], v.r0.z + d.r[2]);
    v.o.position.set(v.p0.x + d.p[0], v.p0.y + d.p[1], v.p0.z + d.p[2]);
    v.o.scale.set(v.s0.x * d.s[0], v.s0.y * d.s[1], v.s0.z * d.s[2]);   // 縮放倍率（嘴巴開合）
  }
  (act.fx || []).forEach(([at, kind, o], i) => { if (s.t >= at && !s.fired.has(i)) { s.fired.add(i); FX[kind](s, o || {}); } });
  // 水灘自己偶爾泛起漣漪
  s.nextRipple -= dt;
  if (s.nextRipple <= 0) { s.nextRipple = 1.6 + Math.random() * 1.4; ripple(local(s, (Math.random() - 0.5) * s.sp.puddle, 0, (Math.random() - 0.5) * s.sp.puddle).setY(0), 0.5, 0xe8f7ff); }
}

// ---------- 介面
const modesEl = document.getElementById('modes'), listEl = document.getElementById('list');
MODES.forEach(([id, name]) => { const b = document.createElement('button'); b.textContent = name; b.dataset.mode = id; b.onclick = () => setMode(id); modesEl.append(b); });
const allBtn = document.createElement('button');
allBtn.innerHTML = '全部<small>六隻一起看</small>'; allBtn.onclick = () => { focus = null; flyTo(); refresh(); };
listEl.append(allBtn);
spirits.forEach((s) => { const b = document.createElement('button'); b.innerHTML = `${s.sp.name}<small>${s.sp.stage} · 大絕：${s.sp.ult}</small>`; b.onclick = () => { focus = s; flyTo(); refresh(); }; listEl.append(b); s.btn = b; });
const speed = document.getElementById('speed'), spin = document.getElementById('spin');
speed.oninput = () => (document.getElementById('speedOut').textContent = speed.value + '×');
let camGoal = null;
function flyTo() {
  if (focus) { const c = focus.holder.position, r = focus.sp.id === 'dragon' ? 10 : 5.8; camGoal = { pos: new THREE.Vector3(c.x + 2.0, 2.6, c.z + r), target: new THREE.Vector3(c.x, 1.0, c.z) }; }
  else camGoal = { pos: new THREE.Vector3(0, 7.2, 13.5), target: new THREE.Vector3(0, 0.8, 0) };
}
function refresh() {
  [...modesEl.children].forEach((b) => b.setAttribute('aria-pressed', b.dataset.mode === mode));
  allBtn.setAttribute('aria-pressed', !focus);
  spirits.forEach((s) => s.btn.setAttribute('aria-pressed', focus === s));
  const sp = (focus || spirits[0]).sp;
  document.getElementById('refTitle').textContent = '原畫 · ' + sp.name;
  document.getElementById('refImg').src = sp.ref;
  document.getElementById('refImg').alt = sp.name + '原畫';
  document.getElementById('refNote').textContent = focus ? '' : '點右上方名稱可切換原畫並拉近模型。';
  document.getElementById('info').innerHTML = SPIRITS.map((x) => `<tr><th>${x.name}</th><td>攻擊：${x.atk}<br>大絕：${x.ult}</td></tr>`).join('');
}
camera.position.set(0, 7.2, 13.5); controls.target.set(0, 0.8, 0);
refresh();

// ---------- 迴圈
const clock = new THREE.Clock();
const labels = document.getElementById('labels');
function resize() { const w = stage.clientWidth, h = stage.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(stage); resize();
// 推進所有幻靈的動作與特效 dt 秒
function stepWorld(dt) {
  spirits.forEach((s) => poseSpirit(s, dt));
  for (let i = fx.length - 1; i >= 0; i--) {
    const f = fx[i]; f.age += dt; const k = Math.min(1, f.age / f.life);
    f.update(k, dt);
    if (k >= 1) { scene.remove(f.obj); f.obj.traverse((o) => { if (o.material) o.material.dispose(); if (o.geometry && o.geometry !== sphere) o.geometry.dispose(); }); fx.splice(i, 1); }
  }
}
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05) * Number(speed.value);
  stepWorld(dt);
  if (camGoal) { camera.position.lerp(camGoal.pos, 0.08); controls.target.lerp(camGoal.target, 0.08); if (camera.position.distanceTo(camGoal.pos) < 0.02) camGoal = null; }
  if (spin.checked) spirits.forEach((s) => (s.holder.rotation.y += 0.004));
  controls.update();
  renderer.render(scene, camera);
  const w = stage.clientWidth, h = stage.clientHeight;
  spirits.forEach((s) => { tmp.copy(s.holder.position).setY(-0.15).project(camera); s.tag.style.left = ((tmp.x + 1) / 2) * w + 'px'; s.tag.style.top = ((1 - tmp.y) / 2) * h + 'px'; s.tag.style.display = tmp.z < 1 ? '' : 'none'; });
});
window.__ws = { stepWorld, THREE, scene, camera, controls, renderer, spirits, setMode, get mode() { return mode; }, focusOn: (i) => { focus = i === null ? null : spirits[i]; flyTo(); refresh(); } };
</script>
</body>
