<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>匯出水系幻靈 GLB</title></head>
<body style="font:14px system-ui;padding:16px">
<h1>水系幻靈與釣魚郎匯出（幻靈奇旅）</h1>
<p id="log">準備中…</p>
<div id="thumbs" style="display:flex;flex-wrap:wrap;gap:8px"></div>
<script src="spirits.js"></script>
<script src="fisherman.js"></script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
// 把 spirits.js／fisherman.js 的程序動作逐格烘焙成 AnimationClip，匯出成遊戲用 GLB，並算圖產生卡面肖像。
import * as THREE from 'three';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { buildBird as buildModel, DETAIL } from './builder.js';
const { SPIRITS, MATERIALS } = window.WATER_SPIRITS;
const FISHER = window.FISHERMAN;
const log = (t) => { document.getElementById('log').textContent = t; console.log(t); };

// 遊戲裡的檔名：水毛蟲、水仙子、小金魚、金魚國王、金魚皇后、水蛟龍王
const FILE = { caterpillar: 'water-caterpillar', fairy: 'water-fairy', goldfish: 'goldfish-1', king: 'goldfish-king', queen: 'goldfish-queen', dragon: 'water-dragon-king' };
// 遊戲動作名稱 ← 本模型動作
const CLIPS = { Idle: 'idle', Walk: 'move', Run: 'move', Attack: 'attack', Ultimate: 'ultimate' };

const env = (t, a, b) => (t < a || t > b ? 0 : Math.sin(((t - a) / (b - a)) * Math.PI));
function namedNodes(model) {
  const nodes = {};
  model.traverse((o) => { if (o.name && o !== model) nodes[o.name] = { o, r0: o.rotation.clone(), p0: o.position.clone(), s0: o.scale.clone() }; });
  return nodes;
}
function applyPose(nodes, pose, t, extra) {
  const n = {};
  for (const k of Object.keys(nodes)) n[k] = { r: [0, 0, 0], p: [0, 0, 0], s: [1, 1, 1] };
  pose(n, t);
  if (extra) extra(n, t);
  for (const [k, v] of Object.entries(nodes)) {
    const d = n[k];
    v.o.rotation.set(v.r0.x + d.r[0], v.r0.y + d.r[1], v.r0.z + d.r[2]);
    v.o.position.set(v.p0.x + d.p[0], v.p0.y + d.p[1], v.p0.z + d.p[2]);
    v.o.scale.set(v.s0.x * d.s[0], v.s0.y * d.s[1], v.s0.z * d.s[2]);
  }
}
// 逐格取樣（30 格／秒）成 position／quaternion／scale 軌道
function bake(name, nodes, act, extra, fps = 30) {
  const frames = Math.max(2, Math.round(act.dur * fps)), times = [], data = {};
  for (const k of Object.keys(nodes)) data[k] = { p: [], q: [], s: [], scaled: false };
  for (let i = 0; i <= frames; i++) {
    const t = (i / frames) * act.dur; times.push(t);
    applyPose(nodes, act.pose, t, extra);
    for (const [k, v] of Object.entries(nodes)) {
      const d = data[k];
      d.p.push(...v.o.position.toArray()); d.q.push(...v.o.quaternion.toArray()); d.s.push(...v.o.scale.toArray());
      if (Math.abs(v.o.scale.x - v.s0.x) + Math.abs(v.o.scale.y - v.s0.y) + Math.abs(v.o.scale.z - v.s0.z) > 1e-4) d.scaled = true;
    }
  }
  const tracks = [];
  for (const [k, d] of Object.entries(data)) {
    tracks.push(new THREE.VectorKeyframeTrack(k + '.position', times, d.p));
    tracks.push(new THREE.QuaternionKeyframeTrack(k + '.quaternion', times, d.q));
    if (d.scaled) tracks.push(new THREE.VectorKeyframeTrack(k + '.scale', times, d.s));
  }
  return new THREE.AnimationClip(name, act.dur, tracks);
}
function gameMaterial(m) { m.roughnessMap = null; m.bumpMap = null; if (m.metalness > 0.3) { m.metalness = 0.3; m.roughness = Math.max(m.roughness, 0.3); } }
// 同關節同材質網格合併（保留頂點色），手機繪製次數大幅減少
function mergeByJoint(root) {
  root.updateMatrixWorld(true);
  const isJoint = (o) => o === root || !!o.name, groups = new Map();
  root.traverse((o) => {
    if (!o.isMesh) return;
    let j = o.parent; while (!isJoint(j)) j = j.parent;
    const key = o.material.uuid;
    if (!groups.has(j)) groups.set(j, new Map());
    const g = groups.get(j); if (!g.has(key)) g.set(key, []); g.get(key).push(o);
  });
  const inv = new THREE.Matrix4(); let before = 0, after = 0;
  for (const [j, byKey] of groups) {
    inv.copy(j.matrixWorld).invert();
    for (const meshes of byKey.values()) {
      before += meshes.length; after++;
      const hasColor = meshes.every((m) => m.geometry.attributes.color);
      const geos = meshes.map((m) => {
        const g = m.geometry.clone();
        for (const name of Object.keys(g.attributes)) if (!['position', 'normal', ...(hasColor ? ['color'] : [])].includes(name)) g.deleteAttribute(name);
        if (!g.attributes.normal) g.computeVertexNormals();
        if (!g.index) g.setIndex([...Array(g.attributes.position.count).keys()]);
        g.morphAttributes = {};
        g.applyMatrix4(new THREE.Matrix4().multiplyMatrices(inv, m.matrixWorld));
        return g;
      });
      const merged = mergeGeometries(geos, false);
      if (!merged) throw Error('合併失敗：' + j.name);
      const mesh = new THREE.Mesh(merged, meshes[0].material);
      meshes.forEach((m) => m.parent.remove(m));
      j.add(mesh);
    }
  }
  const prune = (o) => { [...o.children].forEach(prune); if (o !== root && !o.name && !o.isMesh && o.children.length === 0) o.parent.remove(o); };
  prune(root);
  return before + '→' + after;
}
const exportGLB = (scene, animations) => new Promise((res, rej) => new GLTFExporter().parse(scene, res, rej, { binary: true, animations, onlyVisible: false }));
async function save(name, data) { const r = await fetch('/__save/game/' + name, { method: 'PUT', body: data }); if (!r.ok) throw Error('save ' + name); }

// ---- 肖像算圖：柔和漸層背景、3/4 正面、自動取景
const R = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
R.setSize(640, 640, false); R.toneMapping = THREE.ACESFilmicToneMapping; R.toneMappingExposure = 0.95;
const envTex = new THREE.PMREMGenerator(R).fromScene(new RoomEnvironment(), 0.04).texture;
function bgTexture(top, bottom) {
  const c = document.createElement('canvas'); c.width = 4; c.height = 256; const g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, top); gr.addColorStop(1, bottom); g.fillStyle = gr; g.fillRect(0, 0, 4, 256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
async function portrait(model, file, o = {}) {
  const scene = new THREE.Scene();
  scene.background = bgTexture(o.top || '#E9F6FD', o.bottom || '#BFE3F6'); scene.environment = envTex; scene.environmentIntensity = 0.6;
  const sun = new THREE.DirectionalLight(0xffffff, 2.2); sun.position.set(-3, 6, 7); scene.add(sun, new THREE.HemisphereLight(0xffffff, 0xc8d8e4, 1.0));
  scene.add(model); model.updateMatrixWorld(true);
  const box = o.box || new THREE.Box3().setFromObject(model), c = box.getCenter(new THREE.Vector3()), size = box.getSize(new THREE.Vector3());
  const cam = new THREE.PerspectiveCamera(30, 1, 0.05, 100), dir = new THREE.Vector3(...(o.dir || [0.45, 0.22, 1])).normalize();
  const dist = (Math.max(size.x, size.y, size.z) * (o.zoom || 1.0)) / (2 * Math.tan((15 * Math.PI) / 180));
  cam.position.copy(c).addScaledVector(dir, dist); cam.lookAt(c);
  R.render(scene, cam);
  const blob = await new Promise((r) => R.domElement.toBlob(r, 'image/webp', 0.9));
  await save(file, blob);
  const img = new Image(); img.src = URL.createObjectURL(blob); img.width = 160; document.getElementById('thumbs').append(img);
  scene.remove(model);
}

async function run() {
  DETAIL.k = 0.45;
  const report = [];
  for (const sp of SPIRITS) {
    // 肖像：用高細緻度模型、待機姿勢
    DETAIL.k = 1;
    const pm = buildModel({ id: sp.id, materials: MATERIALS, parts: sp.parts });
    const pn = namedNodes(pm); applyPose(pn, sp.actions.idle.pose, sp.id === 'dragon' ? 1.2 : 0.6);
    await portrait(pm, 'cards/' + FILE[sp.id] + '.webp', { zoom: sp.id === 'dragon' ? 1.2 : 1.3, dir: sp.id === 'fairy' ? [0.3, 0.1, 1] : ['goldfish', 'king', 'queen'].includes(sp.id) ? [0.95, 0.25, 0.75] : [0.55, 0.25, 1] });
    // 遊戲模型：降低面數、烘焙動作、合併網格
    DETAIL.k = 0.32;
    const model = buildModel({ id: sp.id, materials: MATERIALS, parts: sp.parts });
    model.name = FILE[sp.id];
    model.traverse((o) => { if (o.isMesh) { gameMaterial(o.material); o.material.name = o.material.userData.key || o.material.name; } });
    const nodes = namedNodes(model);
    const clips = Object.entries(CLIPS).map(([game, id]) => bake(game, nodes, sp.actions[id]));
    // 受擊：待機姿勢上，整隻往後一縮
    const top = nodes.body ? 'body' : 'root';
    clips.push(bake('Hurt', nodes, { dur: 0.8, pose: sp.actions.idle.pose }, (n, t) => { const k = env(t, 0, 0.8); n[top].r = [n[top].r[0] - 0.35 * k, n[top].r[1], n[top].r[2]]; n[top].p = [n[top].p[0], n[top].p[1], n[top].p[2] - 0.15 * k]; }));
    clips.push(Object.assign(clips[clips.length - 1].clone(), { name: 'React' }));
    applyPose(nodes, sp.actions.idle.pose, 0);
    const merged = mergeByJoint(model);
    const glb = await exportGLB(model, clips);
    await save('models/' + FILE[sp.id] + '.glb', glb);
    report.push(sp.name + ' ' + (glb.byteLength / 1024).toFixed(0) + 'KB 網格' + merged);
    log(report.join('；'));
  }
  // 釣魚郎 NPC
  {
    DETAIL.k = 1;
    const pm = buildModel({ id: 'fisher', materials: FISHER.MATERIALS, parts: FISHER.parts });
    applyPose(namedNodes(pm), FISHER.ACTIONS.idle.pose, 0.5);
    await portrait(pm, 'portraits/fisher_lang-normal.webp', { box: new THREE.Box3(new THREE.Vector3(-0.55, 1.15, -0.3), new THREE.Vector3(0.55, 2.25, 0.3)), zoom: 1.45, dir: [0.25, 0.08, 1], top: '#FFF6E4', bottom: '#F2DDB8' });
    DETAIL.k = 0.32;
    const model = buildModel({ id: 'fisher', materials: FISHER.MATERIALS, parts: FISHER.parts });
    model.name = 'fisher_lang';
    model.traverse((o) => { if (o.isMesh) { gameMaterial(o.material); o.material.name = o.material.userData.key || o.material.name; } });
    const nodes = namedNodes(model);
    const clips = [bake('Idle', nodes, FISHER.ACTIONS.idle), bake('Walk', nodes, FISHER.ACTIONS.move), bake('Run', nodes, FISHER.ACTIONS.move), bake('Wave', nodes, FISHER.ACTIONS.wave)];
    applyPose(nodes, FISHER.ACTIONS.idle.pose, 0);
    const merged = mergeByJoint(model);
    const glb = await exportGLB(model, clips);
    await save('npcs/fisher_lang.glb', glb);
    report.push('釣魚郎 ' + (glb.byteLength / 1024).toFixed(0) + 'KB 網格' + merged);
  }
  log('完成：' + report.join('；'));
  document.title = 'done';
}
run().catch((e) => { log('錯誤：' + e.message); document.title = 'error'; console.error(e); });
</script>
</body></html>
