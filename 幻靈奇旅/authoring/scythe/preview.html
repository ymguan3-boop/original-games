</style></head><body><canvas id="stage"></canvas><section class="panel"><div class="kicker">PHANTOM JOURNEY · WEAPON STUDY</div><h1>星輝長柄鐮刀</h1><span class="tag">3D 模型 / 造型提案</span><p>月弧鍛鋼刀刃、青藍星核與雙段皮革握柄，適合長柄橫掃的戰鬥輪廓。</p><span class="label">觀看角度</span><div class="row" id="views"><button data-view="front">正面</button><button data-view="side">側面</button><button data-view="back">背面</button><button data-view="three">立體</button></div><span class="label">四段普攻 · 武器動作示意</span><div class="row" id="actions"><button data-action="1">① 橫掃</button><button data-action="2">② 回斬</button><button data-action="3">③ 上挑</button><button data-action="4">④ 旋身重斬</button><button data-action="all">連續播放</button><button data-action="idle">靜態</button></div><p class="info">此處展示武器運動節奏；角色持握、命中判定與實際遊戲動作尚待製作。</p><a href="hero.html">查看主角持鐮刀 →</a><span class="label">模型檔案</span><a href="starlight-scythe.glb" download>下載 GLB ↓</a><a href="starlight-scythe.blend" download>下載 Blender 原檔 ↓</a><div id="status">載入模型…</div></section><div class="hint">拖曳旋轉 · 滾輪縮放</div><div id="caption"><strong>造型預覽</strong><span>深藍鍛鋼 · 亮銀刃緣 · 青藍星核</span></div>
<script src="../../vendor/three.min.js"></script><script src="../../vendor/GLTFLoader.js"></script><script>
const T=THREE,canvas=document.querySelector('#stage'),renderer=new T.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;renderer.shadowMap.enabled=true;
const scene=new T.Scene();scene.background=new T.Color('#14242c');scene.fog=new T.Fog('#14242c',12,28);const camera=new T.PerspectiveCamera(35,1,.01,100),target=new T.Vector3(.2,.2,0);let yaw=.24,pitch=.13,distance=5.5;
scene.add(new T.HemisphereLight(0xd6f4ff,0x37403d,.9));for(const [color,power,pos]of [[0xffe2b4,1.7,[-3,5,4]],[0x85dcff,1.1,[4,3,3]],[0xa5ecff,1.8,[0,4,-3]]]){const l=new T.DirectionalLight(color,power);l.position.set(...pos);scene.add(l);}
const env=new T.Scene();env.background=new T.Color('#303e45');for(const x of [-3,3]){const s=new T.Mesh(new T.BoxGeometry(2,4,1),new T.MeshBasicMaterial({color:0xffffff}));s.position.set(x,3,3);env.add(s);}scene.environment=new T.PMREMGenerator(renderer).fromScene(env,.05).texture;
const floor=new T.Mesh(new T.CircleGeometry(2.4,96),new T.MeshStandardMaterial({color:0x263936,metalness:.35,roughness:.65}));floor.rotation.x=-Math.PI/2;floor.position.y=-1.25;scene.add(floor);const ring=new T.Mesh(new T.TorusGeometry(2.2,.009,8,128),new T.MeshBasicMaterial({color:0x88d7ce}));ring.rotation.x=Math.PI/2;ring.position.y=-1.23;scene.add(ring);
const pivot=new T.Group();scene.add(pivot);let model,action='idle',start=0,frameCount=0;const labels=['橫掃','回斬','上挑','旋身重斬'],details=['第一段：從一側往前方橫掃','第二段：反向回斬，銜接上一擊','第三段：由下往上挑起','第四段：轉身帶動長柄，以重斬收尾'];
const trailMat=new T.MeshBasicMaterial({color:0x77ecfa,transparent:true,opacity:0,side:T.DoubleSide,depthWrite:false,blending:T.AdditiveBlending});const trail=new T.Mesh(new T.RingGeometry(.75,1.05,64,1,0,Math.PI*.8),trailMat);scene.add(trail);
new T.GLTFLoader().load('starlight-scythe.glb?v=20261028',g=>{model=g.scene;pivot.add(model);model.traverse(o=>{if(o.isMesh){o.castShadow=true;o.frustumCulled=false;}});document.querySelector('#status').textContent='Blender 模型已載入';window.__ready=true;},undefined,e=>{document.querySelector('#status').textContent='載入失敗：'+e.message;});
function choose(k){action=k;start=performance.now();document.querySelectorAll('#actions button').forEach(b=>b.classList.toggle('active',b.dataset.action===k));if(k==='idle'){document.querySelector('#caption strong').textContent='造型預覽';document.querySelector('#caption span').textContent='深藍鍛鋼 · 亮銀刃緣 · 青藍星核';}}
document.querySelectorAll('#actions button').forEach(b=>b.onclick=()=>choose(b.dataset.action));document.querySelectorAll('#views button').forEach(b=>b.onclick=()=>{yaw=({front:0,side:Math.PI/2,back:Math.PI,three:.35})[b.dataset.view];pitch=.10;});
let drag=null;canvas.onpointerdown=e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(!drag)return;yaw-=(e.clientX-drag[0])*.008;pitch=T.MathUtils.clamp(pitch+(e.clientY-drag[1])*.006,-.65,.9);drag=[e.clientX,e.clientY]};canvas.onpointerup=()=>drag=null;canvas.onwheel=e=>{e.preventDefault();distance=T.MathUtils.clamp(distance*Math.exp(e.deltaY*.001),2.5,10)};
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}onresize=resize;resize();
function tick(now){requestAnimationFrame(tick);let i=-1,u=0;if(action!=='idle'){const t=(now-start)/1000;if(action==='all'){const durations=[.55,.52,.58,.75],total=durations.reduce((a,b)=>a+b,0),cycle=t%total;let sum=0;for(let k=0;k<4;k++){if(cycle<sum+durations[k]){i=k;u=(cycle-sum)/durations[k];break}sum+=durations[k];}}else{i=Number(action)-1;u=(t%1.35)/1.35;}document.querySelector('#caption strong').textContent='第 '+(i+1)+' 段 · '+labels[i];document.querySelector('#caption span').textContent=details[i];}
 pivot.rotation.set(0,0,0);pivot.position.set(0,0,0);trail.visible=i>=0;trailMat.opacity=0;if(i>=0){const attack=Math.sin(Math.PI*u),sweep=(u-.5);if(i===0){pivot.rotation.set(.05,-1.5*sweep,-.65*sweep);pivot.position.x=.38*sweep;}if(i===1){pivot.rotation.set(-.06,1.55*sweep,.7*sweep);pivot.position.x=-.38*sweep;}if(i===2){pivot.rotation.set(1.45*sweep,-.15,.24);pivot.position.y=.35*sweep;}if(i===3){pivot.rotation.set(.3*attack,2*Math.PI*u,-.45*attack);pivot.position.y=.14*attack;}trail.rotation.set(i===2?Math.PI/2:.35,0,i===1?Math.PI:0);trail.position.set(.25,.28,.03);trailMat.opacity=.32*attack;}
 camera.position.copy(target).add(new T.Vector3(Math.sin(yaw)*Math.cos(pitch)*distance,Math.sin(pitch)*distance,Math.cos(yaw)*Math.cos(pitch)*distance));camera.lookAt(target);renderer.render(scene,camera);frameCount++;}requestAnimationFrame(tick);window.SCYTHE={choose,pivot,get model(){return model},get frameCount(){return frameCount}};
