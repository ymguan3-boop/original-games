<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>主角持鐮刀｜造型預覽</title><style>
*{box-sizing:border-box}body{margin:0;background:#13232b;color:#f4ead8;font:14px system-ui,'Microsoft JhengHei',sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}.panel{position:fixed;top:26px;left:26px;width:290px;padding:23px;background:#11242ceF;border:1px solid #60858a77;border-radius:16px;box-shadow:0 16px 50px #0008}.label{color:#a6d3ca;font-size:11px;letter-spacing:2px}h1{font-size:26px;margin:8px 0}p{color:#b8cbc5;line-height:1.7;font-size:12px}.title{font-size:12px;color:#a9c6bf;margin-top:18px;margin-bottom:8px}.row{display:flex;flex-wrap:wrap;gap:7px}button,a{font:12px system-ui;color:#f4e5c6;background:#294342;border:1px solid #688b80;border-radius:7px;padding:8px 10px;cursor:pointer;text-decoration:none}button:hover,button.active{background:#507a6d}a{display:inline-block;margin-top:14px}#status{font-size:11px;color:#a4c8bb;margin-top:16px}.hint{position:fixed;right:26px;bottom:24px;text-align:right;color:#d1dfd4;font-size:12px}.hint b{display:block;color:#eddaad;font-size:18px}@media(max-width:640px){.panel{top:10px;left:10px;width:205px;padding:13px}h1{font-size:21px}p{font-size:11px}.title{margin-top:10px}button{padding:6px}.hint{bottom:12px;right:12px}}
</style></head><body><canvas id="stage"></canvas><div class="panel"><div class="label">PHANTOM JOURNEY · WEAPON STUDY</div><h1>主角 × 星輝鐮刀</h1><p>遊戲主角實際持握鐮刀的比例與外觀。可拖曳旋轉、滾輪縮放。</p><div class="title">觀看角度</div><div class="row"><button data-view="front">正面</button><button data-view="three">斜前</button><button data-view="side">側面</button><button data-view="back">背面</button></div><div class="title">主角動作</div><div class="row"><button data-action="Idle">站立</button><button data-action="SwordReady">持劍待戰</button><button data-action="Walk">行走</button><button data-action="Run">跑步</button></div><p>這是持武器的造型預覽，鐮刀專屬的四段動作仍待製作。</p><a href="preview.html">← 單獨查看鐮刀</a><div id="status">載入主角與武器…</div></div><div class="hint"><b>星輝長柄鐮刀</b>右手握柄 · 以遊戲主角模型展示</div>
<script src="../../vendor/three.min.js"></script><script src="../../vendor/GLTFLoader.js"></script><script src="../../js/hero-costumes.js"></script><script>
const T=THREE,canvas=document.querySelector('canvas'),renderer=new T.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(2,devicePixelRatio));renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1;renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;
const scene=new T.Scene();scene.background=new T.Color('#172a30');const camera=new T.PerspectiveCamera(34,1,.01,50),target=new T.Vector3(0,1,0);let yaw=.25,pitch=.13,distance=5.5;
scene.add(new T.HemisphereLight(0xe2f5ff,0x4e5545,.8));for(const [col,power,pos]of [[0xffe9cb,1.6,[-3,6,5]],[0xaad7ff,.9,[4,4,3]],[0xb0ffff,1.2,[0,5,-4]]]){const l=new T.DirectionalLight(col,power);l.position.set(...pos);if(pos[0]===-3){l.castShadow=true;l.shadow.mapSize.set(1024,1024);l.shadow.camera.left=-3;l.shadow.camera.right=3;l.shadow.camera.top=4;l.shadow.camera.bottom=-3;}scene.add(l);}
const env=new T.Scene();env.background=new T.Color('#475558');for(const x of [-3,3]){const m=new T.Mesh(new T.BoxGeometry(2,4,1),new T.MeshBasicMaterial({color:0xffffff}));m.position.set(x,3,3);env.add(m);}scene.environment=new T.PMREMGenerator(renderer).fromScene(env,.1).texture;
const floor=new T.Mesh(new T.PlaneGeometry(60,60),new T.MeshStandardMaterial({color:0x263b37,roughness:.86}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);const disc=new T.Mesh(new T.CylinderGeometry(1.9,1.93,.06,96),new T.MeshStandardMaterial({color:0x364b46,metalness:.25,roughness:.7}));disc.position.y=-.035;disc.receiveShadow=true;scene.add(disc);
let hero,mixer,weapon,clips,current,attack='',attackStart=0;const actor=new T.Group();scene.add(actor);const errors=[];window.addEventListener('error',e=>errors.push(e.message));
function play(name){if(!mixer)return;attack='';actor.rotation.y=0;const clip=clips.find(c=>c.name===name);if(!clip)return;mixer.stopAllAction();current=mixer.clipAction(clip);current.reset().play();document.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.action===name));}
function strike(which){if(!mixer)return;play('Idle');attack=which;attackStart=performance.now();document.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.strike===which));}
Promise.all([new T.GLTFLoader().loadAsync('../../models/hero.glb'),new T.GLTFLoader().loadAsync('starlight-scythe.glb?v=21')]).then(([h,w])=>{hero=h.scene;clips=h.animations;actor.add(hero);HeroCostumes.create(T).apply(hero,'trainer');window.reaperCostume=createReaperCostume(T,hero);reaperCostume.setEnabled(true);hero.traverse(o=>{if(o.isMesh){o.castShadow=true;o.frustumCulled=false}});const hand=hero.getObjectByName('handR');if(!hand)throw Error('找不到主角右手');weapon=w.scene;hand.add(weapon);weapon.scale.setScalar(.70);weapon.position.set(0,-.07,.035);weapon.rotation.set(0,Math.PI,0);weapon.traverse(o=>{if(o.isMesh)o.castShadow=true});mixer=new T.AnimationMixer(hero);play('Idle');document.querySelector('#status').textContent='主角與鐮刀已載入';window.__ready=true;}).catch(e=>{errors.push(e.message);document.querySelector('#status').textContent='載入失敗：'+e.message});
for(const b of document.querySelectorAll('[data-action]'))b.onclick=()=>play(b.dataset.action);for(const b of document.querySelectorAll('[data-view]'))b.onclick=()=>{yaw=({front:0,three:.45,side:Math.PI/2,back:Math.PI})[b.dataset.view];pitch=.12;};
let drag;canvas.onpointerdown=e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)};canvas.onpointerup=()=>drag=null;canvas.onpointermove=e=>{if(drag){yaw-=(e.clientX-drag[0])*.008;pitch=T.MathUtils.clamp(pitch+(e.clientY-drag[1])*.006,-.45,.8);drag=[e.clientX,e.clientY]}};canvas.onwheel=e=>{e.preventDefault();distance=T.MathUtils.clamp(distance*Math.exp(e.deltaY*.001),2.5,10)};
const controls=document.querySelector('.panel .title:nth-of-type(3)');const section=document.createElement('div');section.innerHTML='<div class="title">四段普攻 · 全身動作示意</div><div class="row"><button data-strike="1">① 橫掃</button><button data-strike="2">② 回斬</button><button data-strike="3">③ 上挑</button><button data-strike="4">④ 旋身重斬</button><button data-strike="all">四段連續</button></div>';document.querySelector('.panel a').before(section);section.querySelectorAll('button').forEach(b=>b.onclick=()=>strike(b.dataset.strike));
function poseAttack(now){if(!attack||!hero)return;const durations=[.65,.62,.68,1.12],total=durations.reduce((a,b)=>a+b,0);let n,u,t=(now-attackStart)/1000;if(attack==='all'){t%=total;let start=0;for(let i=0;i<4;i++){if(t<start+durations[i]){n=i;u=(t-start)/durations[i];break}start+=durations[i];}}else{n=Number(attack)-1;u=(t%durations[n])/durations[n];}const e=Math.sin(Math.PI*u),smooth=x=>{x=T.MathUtils.clamp(x,0,1);return x*x*(3-2*x)};const turn=smooth((u-.22)/.50);actor.rotation.y=n===3?Math.PI*2*turn:(n===0?-.25:n===1?.25:0)*e;
 const rot=(name,x=0,y=0,z=0)=>{const o=hero.getObjectByName(name);if(o)o.rotation.set(x,y,z)};
 // Paired limbs bend and counterbalance; the weapon remains parented to the right hand.
 rot('chest',n===3?.20*e:.10*e,(n===1?.28:-.28)*e,0);rot('head',-.08*e,0,-.05*e);
 rot('upperArmR',n===2?-1.05*e:-.45*e,0,(n===1?-.45:.5)*e);rot('forearmR',-.55*e,0,0);rot('handR',0,0,(n===1?-.25:.25)*e);
 rot('upperArmL',-.4*e,0,-.32*e);rot('forearmL',-.60*e,0,0);
 rot('thighR',-.3*e,0,.17*e);rot('thighL',-.2*e,0,-.20*e);rot('shinR',.5*e,0,0);rot('shinL',.4*e,0,0);rot('footR',-.18*e,0,0);rot('footL',-.15*e,0,0);
 document.querySelector('.hint b').textContent=['① 橫掃','② 回斬','③ 上挑','④ 旋身重斬'][n];}
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}onresize=resize;resize();const clock=new T.Clock();function tick(now=0){requestAnimationFrame(tick);const dt=Math.min(.05,clock.getDelta());mixer?.update(dt);poseAttack(now);camera.position.copy(target).add(new T.Vector3(Math.sin(yaw)*Math.cos(pitch)*distance,Math.sin(pitch)*distance,Math.cos(yaw)*Math.cos(pitch)*distance));camera.lookAt(target);renderer.render(scene,camera)}tick();window.SCYTHE_HERO={get hero(){return hero},get weapon(){return weapon},actor,errors,play,strike};
</script><script src="reaper-costume.js?v=21"></script><script src="grip-motion.js?v=21"></script><script src="review.js?v=21"></script></body></html>
