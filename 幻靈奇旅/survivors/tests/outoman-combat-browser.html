<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>歐頭慢洞穴動作實測</title><style>body{margin:0;background:#111;color:white;font:16px sans-serif}header{padding:8px}iframe{width:100%;height:78vh;border:0}pre{white-space:pre-wrap;color:#eee;max-height:16vh;overflow:auto}</style><header>歐頭慢原始大絕動作與洞穴實戰比對：<b id="status">載入中</b></header><iframe id="game" src="../?qa=1"></iframe><pre id="results"></pre><script type="module">
const result=document.querySelector('#results'),status=document.querySelector('#status'),game=document.querySelector('#game');
const log=x=>result.textContent+=x+'\n';const wait=async fn=>{const end=performance.now()+120000;while(performance.now()<end){if(fn())return;await new Promise(r=>setTimeout(r,100))}throw Error('等待遊戲或模型逾時')};
try{
 await wait(()=>game.contentWindow.document.body?.dataset.ready==='true');const w=game.contentWindow,Q=w.CaveQA,T=w.THREE;
 Q.store.transact('qa-outoman-combat',s=>{s.starterClaimed=true;s.owned=s.team=['charmander','bulbasaur','squirtle']});await Q.enter();Q.bag();const style=w.document.createElement('style');style.textContent='#panel{opacity:0!important;pointer-events:none!important}#panel::backdrop{background:transparent!important;backdrop-filter:none!important}';w.document.head.append(style);Q.scene.setZoom(.65);const world=Q.world,advance=world.update.bind(world);world.update=()=>{};
 const {chooseTestPet}=await import('../js/test-pets.js?v=20261027-v30');
 async function setup(){Q.scene.resetTransient();chooseTestPet(Q.store,Q.data,'pikachu');const r=world.run;Object.assign(r,{time:0,spawnAt:1e6,specialMinute:999,bossWave:1,enemies:[],projectiles:[],pickups:[],pendingUpgrade:0,spiritUltimate:null});Object.assign(r.hero,{x:0,z:3,hp:r.hero.maxHp,attackCd:1e6,pendingAttack:null,invincible:1e6});r.pets.forEach(p=>{p.attackCd=1e6;p.ultimateCd=1e6});Object.assign(r.pets[r.activePet],{x:0,z:0,heading:Math.PI/2,ultimateCd:0,pendingSkill:null,actionUntil:0,hitReactUntil:0,hitSerial:0,statuses:{}});world.spawn();Object.assign(r.enemies[0],{x:5,z:0,hp:1e6,maxHp:1e6,nextAttack:1e6});Q.render();await wait(()=>Q.scene.inspectActor('pet:'+world.run.activePet)?.id==='pikachu');return r;}
 const raw=await new T.GLTFLoader().loadAsync('../models/spirits/outoman-v2.glb'),mix=new T.AnimationMixer(raw.scene),clip=raw.animations.find(x=>x.name==='Ultimate');mix.clipAction(clip).play();
 const cases=[];for(const kind of ['無受擊完整施放','受擊後立即施放','施放途中受擊']){const r=await setup(),pet=r.pets[r.activePet];if(kind==='受擊後立即施放')Q.scene.playPet('Hurt');if(!world.startPetSkill(true,r.enemies[0]))throw Error(kind+'無法開始施放');let rows=[];
 for(let step=0;step<71;step++){if(kind==='施放途中受擊'&&step===18){pet.hitSerial++;pet.hitReactUntil=r.time+.12}advance(.05);Q.scene.update(r,.05);if([5,21,40,55,69].includes(step)){const a=Q.scene.inspectActor('pet:'+r.activePet);mix.setTime(a.clipTime||0);let maxError=0;for(const [name,pose] of Object.entries(a.authoredPose||{})){const b=raw.scene.getObjectByName(name);if(!pose||!b)throw Error('無法比對骨架 '+name);for(const field of ['position','quaternion','scale']){const expected=b[field].toArray();for(let i=0;i<expected.length;i++)maxError=Math.max(maxError,Math.abs(pose[field][i]-expected[i]));}}rows.push({t:+r.time.toFixed(2),mode:a.mode,clipTime:a.clipTime,weight:a.clipWeight,error:maxError,beam:a.outoman?.beamVisible,waves:a.outoman?.wavesVisible,sparks:a.outoman?.sparksVisible});}}
 const bad=rows.filter(x=>x.mode!=='Ultimate'||x.error>.0001||x.weight<.999||x.beam!==(x.clipTime/clip.duration>.38&&x.clipTime/clip.duration<.82)||x.waves!==x.beam||x.sparks!==x.beam);cases.push({kind,rows,bad:bad.length});log(kind+'：'+(bad.length?'FAIL':'PASS')+' '+JSON.stringify(rows));}
 const passed=cases.every(c=>c.bad===0);status.textContent=passed?'PASS':'FAIL';status.style.color=passed?'#70eb9a':'#ff8585';window.outomanCombatReport={passed,cases};if(passed){const r=await setup();world.startPetSkill(true,r.enemies[0]);for(let i=0;i<40;i++){advance(.05);Q.scene.update(r,.05)}}
}catch(e){status.textContent='ERROR';status.style.color='#ff8585';log(e.stack||String(e));window.outomanCombatReport={passed:false,error:String(e)}}
</script></html>
