<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#263960"><title>幻靈奇旅：初光之境</title><link rel="stylesheet" href="css/game.css?v=20261017-chest-alert-v2"><link rel="preload" as="image" href="assets/encounter/surprise.webp?v=20261017-chest-alert-v2"><link rel="stylesheet" href="css/collection-card.css?v=20261017-riceball-guardian-v1"><link rel="stylesheet" href="css/gym-events.css?v=20261013d"><link rel="stylesheet" href="css/monster-cards.css?v=20261014f"></head><body>
<main id="game"><canvas id="scene" aria-label="初光鎮 3D 探索場景"></canvas><div id="labels"></div><div id="load"><div class="sun">✦</div><h1>幻靈奇旅</h1><p>初光之境</p><span id="loadText">整理行囊，前往初光鎮…</span></div>
<div id="hud" aria-label="締約與圖鑑紀錄">
<button id="dexBtn" title="幻靈圖鑑"><span class="dexIcon" aria-hidden="true">▤</span><span class="hudLabel">圖鑑</span><b id="dexCount">0 / 61</b></button>
<span class="supply normal" title="靈核球數量／上限"><i class="coreBall" aria-hidden="true"></i><b id="ballCount">30/30</b></span>
<span class="supply berry" title="星露果"><i class="fruitIcon" aria-hidden="true"></i><b id="berryCount">12</b></span>
<span class="supply great" title="高階靈核球"><i class="coreBall" aria-hidden="true"></i><b id="greatCount">5</b></span>
<span class="supply master" title="星耀靈核球"><i class="coreBall" aria-hidden="true"></i><b id="masterCount">0</b></span>
</div>
<button id="menuBtn" class="floating" aria-label="開啟旅人手冊"><span aria-hidden="true">☰</span> <span>旅人手冊</span></button>
<div id="radar"><canvas id="radarCanvas" width="220" height="220" aria-label="城鎮雷達：建築與 NPC"></canvas><button id="radarToggle" type="button" aria-expanded="false" aria-label="展開城鎮雷達" title="展開／縮小城鎮雷達"></button></div>
<div id="location" hidden></div>
<div id="cameraControls" aria-label="調整場景視角">
<button id="cameraLeftBtn" aria-label="向左旋轉視角" title="向左旋轉">↶</button><button id="cameraRightBtn" aria-label="向右旋轉視角" title="向右旋轉">↷</button><button id="cameraNearBtn" aria-label="拉近視角" title="拉近">＋</button><button id="cameraFarBtn" aria-label="拉遠視角" title="拉遠">−</button>
</div>
<button id="navCancelBtn" hidden aria-label="取消自動導航">× 停止導航</button>
<div id="broadcast" role="status" aria-live="polite" hidden></div>
<div id="target"></div><div id="toast" role="status" aria-live="polite"></div><button id="portal" hidden></button>
<div id="controls"><div id="joystick" aria-label="拖曳移動"><div id="stick"></div></div><div id="actions">
<button id="berryBtn" aria-label="餵食星露果" title="餵食星露果">餵食</button>

<button id="lockBtn" aria-pressed="false" aria-label="鎖定可締約幻靈" title="鎖定可締約幻靈">鎖定</button>
<button id="rollBtn" title="配合移動方向翻滾（Shift）" aria-label="方向翻滾">滾</button>
<button id="captureBtn" type="button" data-ball="normal" aria-label="短按投出靈核球，長按選擇球種" title="短按締約・長按選球">締約</button>
</div></div><div id="ballPicker" hidden role="group" aria-label="選擇幻靈球"></div>
<div id="battleHud" hidden><div id="battleTitle"></div><div id="battleLog" role="status"></div><div id="battleActions"></div></div>
</main><section id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="panel"><header><h2 id="modalTitle"></h2><button id="closeModal" aria-label="關閉">×</button></header><div id="modalBody"></div></div></section>
<section id="dialogue" hidden aria-label="NPC 對話"><img id="portrait" alt=""><div class="dialogueText"><strong id="npcName"></strong><p id="npcText"></p><div id="npcActions"></div></div></section>
