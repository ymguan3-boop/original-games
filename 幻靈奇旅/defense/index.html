<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#2f6b3a">
  <link rel="icon" href="data:,">
  <title>幻靈守護戰｜幻靈奇旅</title>
  <link rel="stylesheet" href="../css/collection-card.css?v=20261020-avian-v1">
  <!-- the endless cave gacha look (summon film, wallet, reward list); cave.css itself is global, so its gacha rules are
       copied into css/cave-gacha.css scoped to dialog#panel -->
  <link rel="stylesheet" href="../survivors/css/v06.css">
  <link rel="stylesheet" href="../survivors/css/summon-v07.css">
  <link rel="stylesheet" href="../survivors/css/v08.css">
  <link rel="stylesheet" href="../survivors/css/v09.css">
  <link rel="stylesheet" href="../survivors/css/v10.css">
  <link rel="stylesheet" href="../survivors/css/v14.css?v=20261024-v14">
  <link rel="stylesheet" href="../survivors/css/v16.css?v=20261025-v16">
  <link rel="stylesheet" href="css/cave-gacha.css?v=20261107-b5">
  <link rel="stylesheet" href="css/defense.css?v=20261107-b5">
  <link rel="stylesheet" href="css/defense-compact.css?v=20261107-b6">
</head>
<body class="defense-scene">
  <canvas id="world" aria-label="幻靈守護戰 戰場"></canvas>
  <div class="vignette" aria-hidden="true"></div>

  <main id="lobby">
    <div id="seaChart" class="sea-wrap"></div>
    <header class="chart-head">
      <img class="logo" src="assets/logo.webp" alt="幻靈奇旅">
      <div class="title-block"><p class="eyebrow">幻靈群島 · SPIRIT ISLES</p><h1>幻靈守護戰</h1></div>
      <div class="chart-tools">
        <span class="points-badge" title="與無盡洞穴共用的轉蛋點數">🎟️ <b id="pointsNow">0</b><small>點</small></span>
        <button id="gachaBtn" class="tool gacha">🎰<span>轉蛋</span></button>
        <button id="deckBtn" class="tool">🃏<span>編組</span></button>
        <button id="sortieBtn" class="tool sortie">⚔️<span>出擊</span></button>
        <button id="menuBtn" class="tool">☰<span>選單</span></button>
      </div>
    </header>
    <aside id="islePanel" class="isle-panel" aria-live="polite"></aside>
    <aside id="tutor" class="tutor" hidden><img class="tutor-face" alt="船長"><b></b><p></p><div class="tutor-btns"><button type="button" data-next class="primary">下一步</button><button type="button" data-skip>略過</button></div></aside>
  </main>

  <div id="hud" hidden>
    <div class="hud-top">
      <div class="hud-summary"><div class="stat stage" id="stageName" role="status" aria-label="關卡"><span class="hud-stage-label" id="hudStageLabel"></span></div><div class="stat weather" id="hudWeatherChip" role="status" aria-label="天氣"><span class="hud-weather-label" id="hudWeatherLabel"></span></div></div>
      <div class="hud-tools">
      <div class="stat deal" title="下一張牌"><span>發牌</span><i><b id="dealFill"></b></i></div>
      <div class="stat pts" title="本場擊倒獲得的轉蛋點數（與無盡洞穴共用）">🎟️ <b id="runPoints">0</b></div>
      <div class="hud-actions">
        <button id="speed" title="遊戲速度">×1</button>
        <button id="pause" title="暫停">❚❚</button>
      </div>
      </div>
    </div>
    <div class="hud-bottom">
      <div id="hand" class="hand"></div>
      <div id="cardInfo" class="card-info" hidden></div>
      <div class="item-wrap"><div id="itemMenu" class="item-menu" hidden></div><button id="items" class="side-btn items"><span class="side-icon">🎒</span><b>道具</b><small id="itemsCount"></small></button></div>
    </div>
    <div id="banner" class="banner" hidden></div>
    <div id="bossIntro" class="boss-intro" hidden role="status" aria-live="polite">
      <div class="bi-portrait"><img id="bossIntroPortrait" alt=""></div>
      <div class="bi-board">
        <header class="bi-title"><span id="bossIntroStage">魔王登場</span><button id="dismissBossIntro" class="bi-close" aria-label="關閉魔王開場台詞" title="關閉">×</button></header>
        <div class="bi-paper"><strong id="bossIntroName"></strong><p id="bossIntroLine"></p></div>
        <i class="bi-grass" aria-hidden="true"></i>
      </div>
    </div>
    <div class="rotate-hint">手機橫放可以看到更寬的戰場</div>
  </div>

  <dialog id="modal"><div id="modalBody"></div></dialog>
  <dialog id="panel"><div class="dialog-top"><p class="eyebrow" id="panelLabel">SPIRIT ISLES</p><button id="closePanel" aria-label="關閉">×</button></div><h2 id="panelTitle"></h2><div id="panelBody"></div></dialog>
  <div id="toast" class="toast" role="status"></div>
  <div id="loading" class="loading"><div class="loading-card"><div class="sail-loader" aria-hidden="true"><i class="sun"></i><i class="cloud c1"></i><i class="cloud c2"></i><svg class="loader-boat" viewBox="-40 -40 80 60"><path d="M-34,-2 L22,-2 Q36,-1 40,8 Q36,16 20,17 L-32,17 Q-36,8 -34,-2 Z" fill="#fbfbf6" stroke="#33445e" stroke-width="3"/><path d="M-33,9 L37,9" stroke="#e23c34" stroke-width="4.5"/><path d="M5,-2 L15,-18 L20,-18 L18,-2 Z" fill="#8fd3ff" stroke="#33445e" stroke-width="2.5"/><circle cx="-5" cy="-19" r="7" fill="#2b1f1a"/><rect x="-11" y="-13" width="13" height="11" rx="3" fill="#3a8fe0"/><rect x="-31" y="-8" width="10" height="6" rx="2" fill="#e23c34"/><rect x="-39" y="-4" width="6" height="15" rx="2" fill="#2b2b33"/></svg><i class="wave w1"></i><i class="wave w2"></i><i class="wave w3"></i></div><p id="loadingText">搭快艇前往幻靈群島…</p><div class="bar" role="progressbar" aria-label="戰鬥場景載入進度" aria-valuemin="0" aria-valuemax="100"><i id="loadingBar"></i></div><p id="loadingElapsed" class="loading-elapsed" aria-live="off">正在準備素材…</p></div></div>

  <link rel="stylesheet" href="../css/scene-loading.css?v=20261107-b5">
  <script src="../js/scene-loading.js?v=20261107-b5"></script>
  <script src="../js/shared-bgm.js?v=20261104-theme-v1"></script>
  <!-- shared with the town and the cave: points/bag (cave ledger) and the wardrobe outfit on the base hero -->
  <script src="../js/cave-economy.js?v=20261029-reaper-v1"></script>
  <script src="../js/hero-costumes.js?v=20261030-reaper-v2"></script>
  <script src="../js/harbor.js?v=20261105-deck-v6"></script>
  <script src="../js/fx/boomerang-chain.js?v=20261106-arena-v3"></script>
  <script src="../js/fx/vfx3d.js?v=20261107-vfx3d-v1"></script>
  <script type="module" src="js/main.js?v=20261107-b5"></script>
</body>
</html>
