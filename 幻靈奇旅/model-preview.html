<!doctype html><html lang="zh-Hant"><head>
<link rel="icon" href="data:,"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>幻靈奇旅｜Blender 模型室</title><link rel="stylesheet" href="css/model-preview.css?v=20261022-room-v2"></head><body>
<div class="wrap">
 <header><div class="title"><small>PHANTOM JOURNEY · MODEL ROOM</small><h1 id="model-title">Blender 模型室</h1></div><p class="lede" id="lede">選一個幻靈家族：同一進化線的幻靈會一起站上舞台，前方的木頭人是招式的假想目標。</p><a class="back" href="./">返回遊戲 →</a></header>
 <div class="picker"><input id="search" type="search" placeholder="搜尋名稱、編號、屬性" aria-label="搜尋幻靈"><select id="subject" aria-label="選擇家族"></select><small id="coverage">讀取圖鑑…</small></div>
 <div class="main">
  <div class="acts">
   <section class="stage" id="stage" aria-label="立體模型預覽"><div class="now" id="now"></div><div class="hint">拖曳旋轉 · 滾輪或雙指縮放</div><div id="error" role="alert" hidden><strong>模型暫時無法顯示</strong><p id="error-message"></p><button id="retry">重新載入</button></div></section>
   <div class="row" role="group" aria-label="基本動作"><h3>基本動作</h3><div class="btns" id="g-basic"></div></div>
   <div class="row moves" role="group" aria-label="招式"><h3>招式</h3><div class="btns" id="g-moves"></div></div>
   <div class="row" id="outfit-row" role="group" aria-label="主角造型" hidden><h3>主角造型</h3><div class="btns" id="outfit-buttons"></div></div>
   <div class="row" role="group" aria-label="展示範圍"><h3>展示</h3><div class="btns"><button id="show-single" aria-pressed="false">單隻特寫</button><button id="show-family" aria-pressed="true">家族並排</button></div></div>
   <div class="row tools"><h3>檢視</h3><div class="btns"><button data-view="front">正面</button><button data-view="three">斜前</button><button data-view="side">側面</button><button data-view="back">背面</button><button data-view="top">俯視</button><button id="pause" aria-pressed="false">暫停</button><button id="snapshot">儲存畫面</button></div></div>
   <p class="desc" id="desc"></p>
  </div>
  <aside>
   <div class="members" id="members" role="tablist" aria-label="家族成員"></div>
   <figure class="ref" id="cardPortrait"><img alt="" decoding="async"><figcaption id="portrait-caption"></figcaption></figure>
   <div class="card" id="card-meta"><h4><span id="card-name"></span><span class="tag" id="card-tag"></span></h4>
    <dl><dt>屬性</dt><dd id="element"></dd><dt>相剋</dt><dd id="matchup"></dd><dt>數值</dt><dd id="stats"></dd><dt>普攻</dt><dd id="skill0"></dd><dt>絕招</dt><dd id="skill1"></dd><dt>取得</dt><dd id="evolution"></dd></dl>
    <p class="foot" id="description"></p></div>
   <p class="foot" id="status" role="status">讀取圖鑑…</p>
  </aside>
 </div>
</div>
